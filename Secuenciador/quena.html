<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
@import url('https://fonts.googleapis.com/css2?family=Michroma&display=swap');
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#0a0804;display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;touch-action:none;overflow:hidden;font-family:'Michroma',monospace;}
#minibar{height:26px;flex-shrink:0;background:#0d0b06;border-bottom:1px solid rgba(255,217,0,0.15);display:flex;align-items:center;padding:0 8px;gap:6px;}
.mmz{width:28px;height:22px;background:rgba(255,217,0,0.15);border:1.5px solid rgba(255,217,0,0.5);border-radius:4px;color:#FFD900;font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
#mm-keys{flex:1;height:14px;position:relative;border-radius:3px;overflow:hidden;background:#1a1408;border:1px solid rgba(255,217,0,0.12);}
.mk-w{position:absolute;top:0;bottom:0;background:rgba(220,210,180,0.5);}
.mk-b{position:absolute;top:0;height:60%;background:#111;z-index:2;}
#mm-view{position:absolute;top:0;bottom:0;background:rgba(255,217,0,0.2);border:2px solid #FFD900;border-radius:2px;pointer-events:none;z-index:3;box-shadow:0 0 0 999px rgba(0,0,0,0.45);}
#mm-oct{font-size:8px;color:#FFD900;flex-shrink:0;}
#kbwrap{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0;}
#kb{position:absolute;top:0;left:0;bottom:0;touch-action:none;}
.w,.b{position:absolute;touch-action:none;}
.w{bottom:3px;top:4px;border-radius:0 0 6px 6px;}
.b{top:4px;z-index:2;border-radius:0 0 4px 4px;height:42%;}
#bot{height:90px;flex-shrink:0;display:flex;align-items:stretch;border-top:1px solid rgba(255,217,0,0.15);background:#080604;}
#caja{flex:2;min-width:0;border-right:1px solid rgba(255,217,0,0.1);padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:5px;}
#lista{width:58px;flex-shrink:0;border-right:1px solid rgba(255,217,0,0.1);display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:5px 3px;gap:3px;}
.lbtn{font-family:'Michroma',monospace;font-size:7.5px;color:rgba(255,217,0,0.4);cursor:pointer;touch-action:manipulation;padding:4px 0;border-radius:4px;border:1px solid transparent;width:100%;text-align:center;letter-spacing:0.5px;transition:none;}
.lbtn.act{color:#0a0804;background:#FFD900;border-color:#FFD900;font-weight:bold;}
#bnr{flex:1;border-right:1px solid rgba(255,217,0,0.1);overflow:hidden;background:#000;position:relative;}
#wfcv{display:block;width:100%;height:100%;}
#trc{width:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
#trc img{width:26px;height:26px;object-fit:contain;opacity:0.85;}
#pnl-ruedas{display:flex;align-items:center;justify-content:space-around;width:100%;height:100%;gap:6px;}
.whl2{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;}
.wl2{font-family:'Michroma',monospace;font-size:6px;letter-spacing:1.5px;color:rgba(255,217,0,0.5);}
.wb2{width:100%;height:28px;border-radius:5px;background:#000;border:1px solid rgba(255,217,0,0.35);position:relative;overflow:hidden;touch-action:none;}
.wb2 canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
.wc2{position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:#FFD900;transform:translateX(-50%);z-index:4;pointer-events:none;opacity:0.7;}
.wv2{font-family:'Michroma',monospace;font-size:7px;color:#FFD900;}
#pnl-reverb,#pnl-delay{display:flex;flex-direction:column;gap:5px;width:100%;}
.rvrow{display:flex;align-items:center;gap:6px;}
.rvlbl{font-family:'Michroma',monospace;font-size:7px;color:rgba(255,217,0,0.65);flex-shrink:0;width:32px;letter-spacing:0.5px;}
.rvsel{font-family:'Michroma',monospace;font-size:7px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.25);border-radius:3px;padding:3px 4px;flex:1;}
.rvsi{-webkit-appearance:none;flex:1;height:5px;border-radius:3px;background:rgba(255,217,0,0.12);outline:none;touch-action:manipulation;}
.rvsi::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#FFD900;cursor:pointer;border:2px solid #000;}
.rvsv{font-family:'Michroma',monospace;font-size:7px;color:#FFD900;width:28px;text-align:right;flex-shrink:0;}
.byp{font-family:'Michroma',monospace;font-size:7px;font-weight:bold;padding:2px 5px;border-radius:3px;border:1px solid rgba(255,217,0,0.35);color:rgba(255,217,0,0.4);cursor:pointer;touch-action:manipulation;flex-shrink:0;margin-left:3px;letter-spacing:0.5px;}
.byp.act{background:#FFD900;color:#000;border-color:#FFD900;}
/* THEME EDITOR */
#thm{position:fixed;left:0;right:0;bottom:0;background:#0d0b06;border-top:2px solid rgba(255,217,0,0.3);z-index:100;display:none;flex-direction:column;padding:12px;gap:10px;}
#thm h3{font-size:11px;color:#FFD900;letter-spacing:2px;}
.trow{display:flex;gap:6px;flex-wrap:wrap;}
.tbtn{font-family:system-ui,sans-serif;font-size:10px;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,217,0,0.3);color:#FFD900;background:rgba(255,217,0,0.05);cursor:pointer;touch-action:manipulation;}
.tbtn.sel{background:#FFD900;color:#000;border-color:#FFD900;}
#thm-custom-panel{display:none;flex-direction:column;gap:8px;}
.crow{display:flex;align-items:center;gap:8px;}
.clbl{font-family:system-ui,sans-serif;font-size:10px;color:rgba(255,217,0,0.7);width:90px;flex-shrink:0;}
.cswatch{width:36px;height:28px;border-radius:4px;border:1px solid rgba(255,217,0,0.3);cursor:pointer;touch-action:manipulation;}
.slots{display:flex;gap:4px;}
.slot{width:36px;height:36px;border-radius:6px;border:1.5px solid rgba(255,217,0,0.3);cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,217,0,0.5);font-family:system-ui,sans-serif;}
.slot.used{border-color:#FFD900;}
/* HSV PICKER */
#hsvpanel{position:fixed;left:0;right:0;bottom:0;background:#0d0b06;border-top:2px solid rgba(255,217,0,0.3);z-index:200;display:none;flex-direction:column;padding:12px;gap:10px;align-items:center;}
#hsvbox{border-radius:6px;touch-action:none;}
#hsvhue{width:100%;height:20px;border-radius:4px;-webkit-appearance:none;touch-action:manipulation;margin-top:4px;}
#hsvhue::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #000;cursor:pointer;}
#hsvhex{font-family:monospace;font-size:14px;color:#FFD900;background:#000;border:1px solid rgba(255,217,0,0.3);border-radius:4px;padding:4px 10px;text-align:center;width:100px;}
.hsvbtns{display:flex;gap:8px;}
.hsvbtn{font-family:system-ui,sans-serif;font-size:11px;padding:8px 20px;border-radius:6px;cursor:pointer;touch-action:manipulation;}
#thm-close{align-self:flex-end;font-family:system-ui,sans-serif;font-size:12px;color:#FFD900;padding:4px 12px;border:1px solid rgba(255,217,0,0.3);border-radius:4px;cursor:pointer;touch-action:manipulation;}
</style>
</head>
<body oncontextmenu="return false">
<div id="minibar">
  <div style="display:flex;gap:3px;flex-shrink:0;">
    <div class="mmz" id="mzo">−</div>
    <div class="mmz" id="mzi">+</div>
  </div>
  <div id="mm-keys"><div id="mm-view"></div></div>

</div>
<div id="kbwrap"><div id="kb"></div></div>
<div id="bot">
  <div id="caja">
    <div id="pnl-ruedas">
      <div class="whl2"><div class="wl2">MOD</div><div class="wb2" id="mw"><canvas id="mwc"></canvas></div><div class="wv2" id="mwv">0</div></div>

        <input id="dlbpm" type="number" min="40" max="240" value="120" style="width:52px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.3);border-radius:3px;font-size:12px;padding:2px 4px;text-align:center;"/>
        <select id="dlsub" style="font-size:9px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.3);border-radius:3px;padding:2px 4px;margin-left:4px;flex:1;">
          <option value="4">1/4</option>

  <div id="lista">

    <div class="lbtn" id="btn-reverb">REVERB</div>

  </div>
  <div id="bnr"><canvas id="wfcv"></canvas></div>
  <div id="trc"><img src="https://jinglesimpactantes.github.io/samples-loop/Secuenciador/TuercaIcono.png" alt="⚙"/></div>
</div>

<!-- THEME EDITOR -->
<div id="thm">
  <h3>THEME EDITOR</h3>
  <div class="trow" id="trow-themes"></div>
  <div id="thm-close">✕ CERRAR</div>
</div>



<script>
var BASE='https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/';
var IRB='https://jinglesimpactantes.github.io/samples-loop/IR/';
var FILES={G3:'Quena_G_.wav',A3:'Quena_A_.wav',B3:'Quena_B_.wav',D4:'Quena_D.wav',E4:'Quena_E.wav',G4:'Quena_G.wav',A4:'Quena_A.wav',C5:'Quena_C-.wav',E5:'Quena_E-.wav'};
var IRF={room:'nice_drum_room.wav',hall:'musikvereinsaal.wav',plate:'StudioNordPlate_2sec.wav',cathedral:'scala_milan_opera_hall.wav'};
var IRM={room:5,hall:1.8,plate:2.5,cathedral:8};
var SMIDI={G3:55,A3:57,B3:59,D4:62,E4:64,G4:67,A4:69,C5:72,E5:76};
var SEM={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
var ALL=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var NES={C:'Do','C#':'Do♯',D:'Re','D#':'Re♯',E:'Mi',F:'Fa','F#':'Fa♯',G:'Sol','G#':'Sol♯',A:'La','A#':'La♯',B:'Si'};
var BP={'C#':0.65,'D#':1.65,'F#':3.65,'G#':4.65,'A#':5.65};
var TOCTS=5,SOCT=2,KWS=[22,26,30,34,38,42,48,54,62,72,84],kwi=7;
var WW=54,BW,KH,pb=0,md=0,rv=0.18,cIR='plate';
var actx=null,bufs={},irb={},nds={},rcts=[],pts={};
var mwO=0,pwO=0,sx=0,rvOn=true,dlOn=true;
var dG,wG,cvR,dlNode=null,dlWet=null;
var analyser=null,wfBuf=null;
var ACCENT='#FFD900';

// ===== THEMES =====
var TBASE='https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/Teclas/';
var TPNG={};
var TFILES={blancaL:'TeclaBlanca_Larga.png',blancaC:'TeclaBlanca_Corta.png',negraL:'TeclaNegra_Larga.png',negraC:'TeclaNegra_Corta.png',rojaL:'TeclaRoja_Larga.png',rojaC:'TeclaRoja_Corta.png',caniaL:'TeclaCania_Larga.png',caniaC:'TeclaCania_Corta.png',grisL:'TeclaGris_Larga.png'};
Object.keys(TFILES).forEach(function(k){var img=new Image();img.src=TBASE+TFILES[k];TPNG[k]=img;});

// Theme definitions: {name, accent, larga, corta, largaOn, cortaOn}
var THEME_LIST=[
  {id:'classic',   name:'Classic',      accent:'#FFD900', larga:'blancaL', corta:'negraC'},
  {id:'ivory',     name:'Ivory',        accent:'#FFD900', larga:'blancaL', corta:'caniaC'},
  {id:'classcana', name:'Classic Caña', accent:'#FFD900', larga:'caniaL',  corta:'negraC'},
  {id:'purecana',  name:'Pure Caña',    accent:'#c8a050', larga:'caniaL',  corta:'caniaC'},
  {id:'shadow',    name:'Shadow',       accent:'#FFD900', larga:'grisL',   corta:'negraC'},
  {id:'noir',      name:'Noir',         accent:'#FFD900', larga:'negraL',  corta:'negraC'},
  {id:'inverted',  name:'Inverted',     accent:'#FFD900', larga:'negraL',  corta:'blancaC'},
  {id:'redblack',  name:'Red & Black',  accent:'#cc2200', larga:'negraL',  corta:'rojaC'},
  {id:'crimson',   name:'Crimson',      accent:'#cc2200', larga:'rojaL',   corta:'negraC'}
];
var curThemeData=THEME_LIST[0];
var ACCENT=curThemeData.accent;

function drawKeyImg(g,img,x,y,w,h){
  if(img&&img.complete&&img.naturalWidth>0){
    g.drawImage(img,x,y,w,h);
  } else {
    g.fillStyle='#888';g.fillRect(x,y,w,h);
  }
}

function setAccent(col){
  ACCENT=col;
  document.querySelectorAll('.mmz').forEach(function(el){el.style.color=col;el.style.borderColor=col;});
  var mv=document.getElementById('mm-view');if(mv)mv.style.borderColor=col;
  var mo=document.getElementById('mm-oct');if(mo)mo.style.color=col;
  document.querySelectorAll('.wl2,.wv2,.wv,.rvsv,.rvlbl').forEach(function(el){el.style.color=col;});
  document.querySelectorAll('.wc2').forEach(function(el){el.style.background=col;});
  document.querySelectorAll('.wb2').forEach(function(el){el.style.borderColor=col;});
  document.querySelectorAll('.byp.act,.lbtn.act').forEach(function(el){el.style.background=col;el.style.borderColor=col;el.style.color='#0a0804';});
  dW('mwc',mwO);dW('pwc',pwO);
}

function applyTheme(td){
  curThemeData=td;
  setAccent(td.accent);
  bKb();
}

// Build theme buttons
function buildThemeButtons(){
  var trow=document.getElementById('trow-themes');
  if(!trow)return;
  trow.innerHTML='';
  THEME_LIST.forEach(function(td){
    var btn=document.createElement('div');
    btn.className='tbtn'+(td.id===curThemeData.id?' sel':'');
    btn.textContent=td.name;
    btn.addEventListener('pointerdown',function(e){
      e.preventDefault();
      document.querySelectorAll('.tbtn').forEach(function(b){b.classList.remove('sel');});
      btn.classList.add('sel');
      applyTheme(td);
    },{passive:false});
    trow.appendChild(btn);
  });
}
var customSlots=JSON.parse(localStorage.getItem('qslots')||'{}');

// ===== AUDIO =====
function n2m(n,o){return(o+1)*12+SEM[n];}
function bst(n,o){var m=n2m(n,o),b=null,bd=999;Object.keys(SMIDI).forEach(function(s){var d=Math.abs(SMIDI[s]-m);if(d<bd){bd=d;b=s;}});return{s:b,d:m-SMIDI[b]};}
function gac(){
  if(!actx){
    try{actx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});}catch(e){actx=new(window.AudioContext||window.webkitAudioContext)();}
    var mg=actx.createGain();mg.gain.value=1;
    dG=actx.createGain();dG.gain.value=1;
    wG=actx.createGain();wG.gain.value=rv*IRM[cIR];
    cvR=actx.createConvolver();
    var l=Math.floor(actx.sampleRate*1.5),bf=actx.createBuffer(2,l,actx.sampleRate);
    for(var c=0;c<2;c++){var da=bf.getChannelData(c);for(var i=0;i<l;i++)da[i]=(Math.random()*2-1)*Math.pow(1-i/l,1.5);}
    cvR.buffer=bf;
    dG.connect(mg);wG.connect(cvR);cvR.connect(mg);mg.connect(actx.destination);
    Object.keys(IRF).forEach(function(nm){var n=nm;fetch(IRB+IRF[n]).then(function(r){return r.arrayBuffer();}).then(function(ab){return actx.decodeAudioData(ab);}).then(function(b){irb[n]=b;if(n===cIR)cvR.buffer=b;}).catch(function(){});});
  }
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function loadS(){var c=gac();Object.keys(FILES).forEach(function(n){var nL=n;fetch(BASE+FILES[nL]).then(function(r){return r.arrayBuffer();}).then(function(ab){return c.decodeAudioData(ab);}).then(function(b){bufs[nL]=b;}).catch(function(){});});}
function play(id,n,o,vel,gl){
  var c=gac();if(nds[id])stp(id);
  var atk=gl?0.005:0.008,m=bst(n,o);
  var g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vel,c.currentTime+atk);
  var lfo=c.createOscillator(),lf=c.createGain(),la=c.createGain();
  lfo.type='sine';lfo.frequency.value=3.2;lf.gain.value=md*0.022;la.gain.value=md*vel*0.28;
  lfo.connect(lf);lfo.connect(la);lfo.start();
  if(bufs[m.s]){
    var src=c.createBufferSource();src.buffer=bufs[m.s];var rt=Math.pow(2,(m.d+pb*2)/12);src.playbackRate.value=rt;
    lf.connect(src.playbackRate);la.connect(g.gain);src.connect(g);g.connect(dG);g.connect(wG);src.start();
    nds[id]={src:src,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,r:rt,v:vel,s:true};
  } else {
    var f=440*Math.pow(2,(n2m(n,o)-69)/12)*Math.pow(2,pb*2/12);
    var o1=c.createOscillator(),o2=c.createOscillator();
    o1.type='sine';o2.type='triangle';o1.frequency.value=f;o2.frequency.value=f*1.001;
    lf.connect(o1.frequency);lf.connect(o2.frequency);la.connect(g.gain);
    o1.connect(g);o2.connect(g);g.connect(dG);g.connect(wG);o1.start();o2.start();
    nds[id]={o1:o1,o2:o2,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,v:vel,s:false};
  }
}
function stp(id){
  var nd=nds[id];if(!nd)return;var c=gac();
  nd.g.gain.cancelScheduledValues(c.currentTime);nd.g.gain.setValueAtTime(nd.g.gain.value,c.currentTime);nd.g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.05);
  var s=nd.src,o1=nd.o1,o2=nd.o2,lfo=nd.lfo;
  setTimeout(function(){try{if(s)s.stop();}catch(e){}try{if(o1)o1.stop();if(o2)o2.stop();}catch(e){}try{if(lfo)lfo.stop();}catch(e){}},80);
  delete nds[id];
}
function uV(id,y,t,b){var nd=nds[id];if(!nd||!actx)return;var p=(y-t)/(b-t),v=Math.max(0.1,Math.min(0.95,0.1+p*0.85));nd.v=v;nd.g.gain.setTargetAtTime(v,actx.currentTime,0.015);}

// WHEELS
function dW(cid,off){
  var c2=document.getElementById(cid);if(!c2)return;
  var par=c2.parentElement,w=par.offsetWidth,h=par.offsetHeight;if(!w||!h)return;
  c2.width=w;c2.height=h;c2.style.width=w+'px';c2.style.height=h+'px';
  var ct=c2.getContext('2d');ct.fillStyle='#000';ct.fillRect(0,0,w,h);
  var sp=10,s=((off%sp)+sp)%sp;
  for(var x=s-sp;x<w+sp;x+=sp){
    var dd=Math.abs(x-w/2)/(w/2),al=Math.max(0.08,0.8-dd*0.75);
    ct.beginPath();ct.moveTo(x,2);ct.lineTo(x,h-2);
    ct.strokeStyle=hexToRgba(ACCENT,al);ct.lineWidth=1.5;ct.stroke();
  }
}
function hexToRgba(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return'rgba('+r+','+g+','+b+','+a+')';}
function mkW(wid,cid,vid,mn,mx,onM,onR){

var PRESETS={plate:{predly:40,decay:3.3,size:70,damp:40,diff:45,gain:-2.0,mix:18},hall:{predly:0,decay:3.3,size:50,damp:20,diff:50,gain:1.0,mix:18},room:{predly:50,decay:5.7,size:30,damp:35,diff:70,gain:-7.0,mix:18},cathedral:{predly:25,decay:8.0,size:100,damp:50,diff:60,gain:-2.0,mix:18}};
var RP={predly:40,decay:3.3,size:70,damp:40,diff:45,gain:-2.0};
function applyIR(){
  if(!actx||!irb[cIR])return;
  var src=irb[cIR],sr=actx.sampleRate,gainLin=Math.pow(10,RP.gain/20);
  var srcLen=src.length,newLen=Math.floor(srcLen*(RP.size/100)*(RP.decay/2));
  if(newLen<256)newLen=256;
  var preLen=Math.floor((RP.predly/1000)*sr),totalLen=preLen+newLen;
  var nb=actx.createBuffer(2,totalLen,sr);
  for(var ch=0;ch<2;ch++){var srcD=src.getChannelData(ch<src.numberOfChannels?ch:0),dst=nb.getChannelData(ch);for(var i=0;i<totalLen;i++){var si=i-preLen;if(si<0){dst[i]=0;continue;}var srcI=Math.floor(si*(srcLen/newLen));if(srcI>=srcLen){dst[i]=0;continue;}dst[i]=srcD[srcI]*Math.pow(1-si/newLen,RP.decay*0.5+0.5)*(1-(RP.damp/100)*(si/newLen)*0.8)*(srcD[srcI]*(1-RP.diff/100)+((srcI>0?srcD[srcI-1]:0)*(RP.diff/100)))*gainLin;}}
  cvR.buffer=nb;
}
function loadPreset(ir){
  var p=PRESETS[ir];if(!p)return;
  RP.predly=p.predly;RP.decay=p.decay;RP.size=p.size;RP.damp=p.damp;RP.diff=p.diff;RP.gain=p.gain;rv=p.mix/100;
  var irScale=(ir==='cathedral')?0.2:1.0;
  if(wG&&actx){var gL=Math.pow(10,p.gain/20);wG.gain.setTargetAtTime(rv*IRM[ir]*gL*irScale,actx.currentTime,0.05);}
  var mx=document.getElementById('rvmix'),mxv=document.getElementById('rvmixv');
  if(mx){mx.value=p.mix;mxv.textContent=p.mix+'%';}
  setTimeout(applyIR,100);
}

// TOUCH VIBRATO — deslizar verticalmente sobre tecla presionada activa vibrato táctil
var touchVibrato={};
function startTouchVib(id,nd){
  if(touchVibrato[id])return;
  if(!actx||!nd||!nd.s)return;
  var phase=0,baseRate=nd.r,depth=0,active=true;
  function tick(){
    if(!active)return;
    phase+=0.12;
    var vib=Math.sin(phase)*depth;
    nd.src.playbackRate.setTargetAtTime(baseRate*(1+vib),actx.currentTime,0.01);
    requestAnimationFrame(tick);
  }
  touchVibrato[id]={active:true,setDepth:function(d){depth=d;},stop:function(){active=false;touchVibrato[id]=null;if(nd.src)nd.src.playbackRate.setTargetAtTime(baseRate,actx.currentTime,0.05);}};
  tick();
}
function stopTouchVib(id){if(touchVibrato[id])touchVibrato[id].stop();}
function aS(){var w=document.getElementById('kbwrap');if(!w)return;var mx=TOCTS*7*(WW+2)-w.clientWidth;sx=Math.max(0,Math.min(mx||0,sx));document.getElementById('kb').style.transform='translateX(-'+sx+'px)';uMM();}
function bR(){rcts=[];var all=document.querySelectorAll('.w,.b');for(var i=0;i<all.length;i++){var r=all[i].getBoundingClientRect();rcts.push({id:all[i].dataset.id,b:all[i].classList.contains('b'),l:r.left,r:r.right,t:r.top,bo:r.bottom});}}
function bMM(){var mk=document.getElementById('mm-keys');if(!mk)return;mk.innerHTML='<div id="mm-view"></div>';document.getElementById('mm-view').style.borderColor=ACCENT;var mkW=mk.clientWidth,tot=TOCTS*7*(WW+2),sc=mkW/tot;for(var oi=0;oi<TOCTS;oi++){var wi=0;for(var i=0;i<ALL.length;i++){var n=ALL[i];if(n.indexOf('#')>=0){var d2=document.createElement('div');d2.className='mk-b';d2.style.left=((oi*7+(BP[n]||0))*(WW+2)*sc)+'px';d2.style.width=Math.max(1,BW*sc)+'px';mk.appendChild(d2);}else{var d=document.createElement('div');d.className='mk-w';d.style.left=((oi*7+wi)*(WW+2)*sc)+'px';d.style.width=Math.max(1,(WW+2)*sc-0.5)+'px';mk.appendChild(d);wi++;}}}uMM();}
function uMM(){var mk=document.getElementById('mm-keys'),vw=document.getElementById('mm-view'),w=document.getElementById('kbwrap');if(!mk||!vw||!w)return;var tot=TOCTS*7*(WW+2),sc=mk.clientWidth/tot;vw.style.left=(sx*sc)+'px';vw.style.width=(w.clientWidth*sc)+'px';var co=SOCT+Math.floor(sx/(7*(WW+2)));document.getElementById('mm-oct').textContent='C'+Math.max(SOCT,Math.min(SOCT+TOCTS-1,co));}
(function(){var mb=document.getElementById('minibar'),drag=false,pid=null,sx2=0,so=0,lt=0;mb.addEventListener('pointerdown',function(e){var mk=document.getElementById('mm-keys'),r=mk.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right)return;var now=Date.now();if(now-lt<300){kwi=7;sx=Math.max(0,(4-SOCT)*7*(KWS[kwi]+2));bKb();lt=0;return;}lt=now;e.preventDefault();drag=true;pid=e.pointerId;sx2=e.clientX;so=sx;try{mb.setPointerCapture(e.pointerId);}catch(ex){}},{passive:false});mb.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==pid)return;var mk=document.getElementById('mm-keys'),tot=TOCTS*7*(WW+2);sx=so+(e.clientX-sx2)*(tot/mk.clientWidth);aS();setTimeout(bR,30);},{passive:false});mb.addEventListener('pointerup',function(){drag=false;});mb.addEventListener('pointercancel',function(){drag=false;});})();
function atP(x,y){for(var i=0;i<rcts.length;i++){var r=rcts[i];if(r.b&&x>=r.l&&x<=r.r&&y>=r.t&&y<=r.bo)return r;}for(var i=0;i<rcts.length;i++){var r=rcts[i];if(!r.b&&x>=r.l&&x<=r.r&&y>=r.t&&y<=r.bo)return r;}return null;}
function gE(id){return document.querySelector('[data-id="'+id+'"]');}
function bnKb(){
  var wrap=document.getElementById('kbwrap');if(!wrap)return;
  if(wrap._pd){wrap.removeEventListener('pointerdown',wrap._pd);wrap.removeEventListener('pointermove',wrap._pm);wrap.removeEventListener('pointerup',wrap._pu);wrap.removeEventListener('pointercancel',wrap._pu);}
  wrap._pd=function(e){e.preventDefault();var kr=atP(e.clientX,e.clientY);if(!kr)return;try{wrap.setPointerCapture(e.pointerId);}catch(ex){}pts[e.pointerId]={id:kr.id,startY:e.clientY,lastY:e.clientY,vibActive:false};var el=gE(kr.id);if(el)setKeyOn(el,true);var n=kr.id.replace(/[0-9]/g,''),o=parseInt(kr.id.match(/[0-9]+/)[0]),p=(e.clientY-kr.t)/(kr.bo-kr.t);play(kr.id,n,o,Math.max(0.1,Math.min(0.95,0.1+p*0.85)),false);};

    if(kr.id===pr){

      var dy=Math.abs(e.clientY-pt.lastY);pt.lastY=e.clientY;
      var nd=nds[pr];
      if(dy>3&&nd&&nd.s){if(!pt.vibActive){pt.vibActive=true;startTouchVib(pr,nd);}if(touchVibrato[pr])touchVibrato[pr].setDepth(Math.min(dy/200,0.015));}

    pts[e.pointerId]={id:kr.id,startY:e.clientY,lastY:e.clientY,vibActive:false};
    var el=gE(kr.id);if(el)setKeyOn(el,true);var n=kr.id.replace(/[0-9]/g,''),o=parseInt(kr.id.match(/[0-9]+/)[0]),p=(e.clientY-kr.t)/(kr.bo-kr.t);play(kr.id,n,o,Math.max(0.1,Math.min(0.95,0.1+p*0.85)),true);};

// WAVEFORM
function initWF(){
  var c=document.getElementById('wfcv'),p=c.parentElement;
  c.width=p.offsetWidth;c.height=p.offsetHeight;
  if(!window._quenaImg){
    window._quenaImg=new Image();
    window._quenaImg.src='https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/Quena_Pantalla.jpg';
  }
}
function startWF(){if(!actx||analyser)return;analyser=actx.createAnalyser();analyser.fftSize=256;wfBuf=new Uint8Array(analyser.fftSize);dG.connect(analyser);drawWF();}
function drawWF(){
  requestAnimationFrame(drawWF);
  var c=document.getElementById('wfcv');if(!c)return;
  var W=c.width,H=c.height,g=c.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,W,H);
  // Quena sketch background
  if(window._quenaImg&&window._quenaImg.complete){
    var img=window._quenaImg;
    var iw=img.naturalWidth,ih=img.naturalHeight;
    var scale=Math.min(W/iw,H/ih);
    var dw=iw*scale,dh=ih*scale;
    var dx=(W-dw)/2,dy=(H-dh)/2;
    g.drawImage(img,dx,dy,dw,dh);
  }
  // Grid
  g.strokeStyle='rgba(255,217,0,0.06)';g.lineWidth=0.5;
  var gx=Math.floor(W/6),gy=Math.floor(H/4);
  for(var xi=gx;xi<W;xi+=gx){g.beginPath();g.moveTo(xi,0);g.lineTo(xi,H);g.stroke();}
  for(var yi=gy;yi<H;yi+=gy){g.beginPath();g.moveTo(0,yi);g.lineTo(W,yi);g.stroke();}
  // Center line — very transparent so it doesn't cover quena holes
  g.strokeStyle='rgba(255,217,0,0.15)';g.lineWidth=0.5;
  g.beginPath();g.moveTo(0,H/2);g.lineTo(W,H/2);g.stroke();
  // Left glow
  var glow=g.createLinearGradient(0,0,W*0.25,0);
  glow.addColorStop(0,'rgba(255,217,0,0.06)');glow.addColorStop(1,'rgba(255,217,0,0)');
  g.fillStyle=glow;g.fillRect(0,0,W*0.25,H);
  if(!analyser)return;
  analyser.getByteTimeDomainData(wfBuf);
  var sl=W/wfBuf.length;
  g.save();g.shadowColor=ACCENT;g.shadowBlur=6;
  g.beginPath();g.strokeStyle=hexToRgba(ACCENT,0.4);g.lineWidth=2;
  for(var i=0;i<wfBuf.length;i++){var y=H/2+(wfBuf[i]-128)/128*(H/2*0.82);i===0?g.moveTo(0,y):g.lineTo(i*sl,y);}
  g.stroke();g.restore();
  g.beginPath();g.strokeStyle=ACCENT;g.lineWidth=1.2;
  for(var i=0;i<wfBuf.length;i++){var y=H/2+(wfBuf[i]-128)/128*(H/2*0.82);i===0?g.moveTo(0,y):g.lineTo(i*sl,y);}
  g.stroke();
}
