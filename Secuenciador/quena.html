<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Michroma&display=swap');
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
body{margin:0;background:#0a0804;display:flex;flex-direction:column;height:100vh;touch-action:none;overflow:hidden;}
#minibar{height:26px;flex-shrink:0;background:#0d0b06;border-bottom:1px solid rgba(255,217,0,0.15);display:flex;align-items:center;padding:0 8px;gap:6px;}
.mmz{width:20px;height:20px;background:rgba(255,217,0,0.08);border:1px solid rgba(255,217,0,0.2);border-radius:3px;color:#FFD900;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
#mm-keys{flex:1;height:14px;position:relative;border-radius:3px;overflow:hidden;background:#1a1408;border:1px solid rgba(255,217,0,0.12);}
.mk-w{position:absolute;top:0;bottom:0;background:rgba(220,210,180,0.5);}
.mk-b{position:absolute;top:0;height:60%;background:#111;z-index:2;}
#mm-view{position:absolute;top:0;bottom:0;background:rgba(255,217,0,0.2);border:2px solid #FFD900;border-radius:2px;pointer-events:none;z-index:3;box-shadow:0 0 0 999px rgba(0,0,0,0.45);}
#mm-oct{font-family:'Michroma',sans-serif;font-size:8px;color:#FFD900;flex-shrink:0;}
#kbwrap{flex:1;position:relative;overflow:hidden;touch-action:none;}
#kb{position:absolute;top:0;left:0;bottom:0;touch-action:none;}
.w{position:absolute;bottom:3px;top:4px;background:linear-gradient(135deg,rgba(255,255,255,0.5) 0%,transparent 35%),linear-gradient(180deg,#c8c0a8,#f8f4ea);border:1px solid rgba(0,0,0,0.2);border-radius:0 0 6px 6px;touch-action:none;box-shadow:0 5px 12px rgba(0,0,0,0.5);}
.w.on{background:linear-gradient(180deg,#b8a800,#FFD900);box-shadow:0 0 16px rgba(255,217,0,0.6);}
.b{position:absolute;top:4px;z-index:2;background:linear-gradient(180deg,#111,#222);border-radius:0 0 4px 4px;touch-action:none;box-shadow:2px 5px 10px rgba(0,0,0,0.8);height:42%;}
.b.on{background:linear-gradient(180deg,#2a1e00,#FFD900);box-shadow:0 0 14px rgba(255,217,0,0.6);}
#bot{height:78px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:4px 10px;border-top:1px solid rgba(255,217,0,0.08);}
.whl{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;border:1px solid rgba(255,217,0,0.3);border-radius:6px;padding:4px 6px;}
.wl{font-family:'Michroma',sans-serif;font-size:6px;letter-spacing:1.5px;color:rgba(255,217,0,0.55);}
.wb{width:90px;height:32px;border-radius:4px;background:#000;border:1px solid rgba(255,217,0,0.4);position:relative;overflow:hidden;touch-action:none;}
.wb canvas{position:absolute;inset:0;width:100%;height:100%;}
.wc{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#FFD900;transform:translateX(-50%);z-index:4;pointer-events:none;}
.wv{font-family:'Michroma',sans-serif;font-size:7px;color:#FFD900;}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#ndsp{font-family:'Michroma',sans-serif;font-size:12px;letter-spacing:2px;color:#FFD900;}
#rvs{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0;border:1px solid rgba(255,217,0,0.3);border-radius:6px;padding:4px 6px;}
#irs{font-family:'Michroma',sans-serif;font-size:6px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.3);border-radius:3px;padding:2px 3px;touch-action:manipulation;}
#rkr{display:flex;align-items:center;gap:4px;}
#rkl{font-family:'Michroma',sans-serif;font-size:6px;color:rgba(255,217,0,0.5);}
#rkn{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#444,#111 60%,#000);border:1.5px solid rgba(255,217,0,0.5);position:relative;touch-action:none;flex-shrink:0;}
#rkd{position:absolute;width:3px;height:3px;background:#FFD900;border-radius:50%;top:3px;left:50%;transform:translateX(-50%);}
#rkv{font-family:'Michroma',sans-serif;font-size:7px;color:#FFD900;}
#gbt{width:20px;height:20px;background:rgba(255,217,0,0.08);border:1px solid rgba(255,217,0,0.2);border-radius:3px;color:#FFD900;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;flex-shrink:0;}
#bot2{height:78px;flex-shrink:0;display:none;align-items:center;gap:3px;padding:4px 8px;border-top:1px solid rgba(255,217,0,0.2);background:#0a0804;}
.rp{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;}
.rl{font-family:'Michroma',sans-serif;font-size:5px;color:rgba(255,217,0,0.5);}
.rc{display:flex;align-items:center;gap:1px;}
.rb{width:15px;height:15px;background:rgba(255,217,0,0.08);border:1px solid rgba(255,217,0,0.2);border-radius:3px;color:#FFD900;font-size:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
.rv2{font-family:'Michroma',sans-serif;font-size:8px;color:#FFD900;min-width:26px;text-align:center;background:rgba(0,0,0,0.5);border:1px solid rgba(255,217,0,0.15);border-radius:3px;padding:1px 2px;}
.ru{font-family:'Michroma',sans-serif;font-size:5px;color:rgba(255,217,0,0.35);}
#xcl{width:20px;height:20px;background:rgba(255,217,0,0.08);border:1px solid rgba(255,217,0,0.2);border-radius:3px;color:#FFD900;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;flex-shrink:0;}
</style>
</head>
<body oncontextmenu="return false">
<div id="minibar">
  <div style="display:flex;gap:3px;flex-shrink:0;">
    <div class="mmz" id="mzo">−</div>
    <div class="mmz" id="mzi">+</div>
  </div>
  <div id="mm-keys"><div id="mm-view"></div></div>
  <div id="mm-oct">C4</div>
</div>
<div id="kbwrap"><div id="kb"></div></div>
<div id="bot">
  <div class="whl">
    <div class="wl">MOD</div>
    <div class="wb" id="mw"><canvas id="mwc"></canvas></div>
    <div class="wv" id="mwv">0</div>
  </div>
  <div class="whl">
    <div class="wl">PITCH</div>
    <div class="wb" id="pw"><canvas id="pwc"></canvas><div class="wc"></div></div>
    <div class="wv" id="pwv">0</div>
  </div>
  <div id="mid"><div id="ndsp">—</div></div>
  <div id="rvs">
    <div style="display:flex;align-items:center;gap:4px;">
      <select id="irs">
        <option value="room">ROOM</option>
        <option value="hall">HALL</option>
        <option value="plate" selected>PLATE</option>
        <option value="cathedral">CATHEDRAL</option>
      </select>
      <div id="gbt">⚙</div>
    </div>
    <div id="rkr">
      <div id="rkl">REVERB</div>
      <div id="rkn"><div id="rkd"></div></div>
      <div id="rkv">20%</div>
    </div>
  </div>
</div>
<div id="bot2">
  <div class="rp"><div class="rl">PRE-DLY</div><div class="rc"><div class="rb" id="p1">▼</div><div class="rv2" id="p2">10</div><div class="rb" id="p3">▲</div></div><div class="ru">ms</div></div>
  <div class="rp"><div class="rl">DECAY</div><div class="rc"><div class="rb" id="d1">▼</div><div class="rv2" id="d2">2.0</div><div class="rb" id="d3">▲</div></div><div class="ru">s</div></div>
  <div class="rp"><div class="rl">SIZE</div><div class="rc"><div class="rb" id="s1">▼</div><div class="rv2" id="s2">65</div><div class="rb" id="s3">▲</div></div></div>
  <div class="rp"><div class="rl">DAMP</div><div class="rc"><div class="rb" id="a1">▼</div><div class="rv2" id="a2">40</div><div class="rb" id="a3">▲</div></div><div class="ru">%</div></div>
  <div class="rp"><div class="rl">DIFF</div><div class="rc"><div class="rb" id="f1">▼</div><div class="rv2" id="f2">70</div><div class="rb" id="f3">▲</div></div></div>
  <div class="rp"><div class="rl">GAIN</div><div class="rc"><div class="rb" id="g1">▼</div><div class="rv2" id="g2">0.0</div><div class="rb" id="g3">▲</div></div><div class="ru">dB</div></div>
  <div id="xcl">✕</div>
</div>
<script>
var BASE='https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/';
var IRB='https://jinglesimpactantes.github.io/samples-loop/IR/';
var FILES={G3:'Quena_G_.wav',A3:'Quena_A_.wav',B3:'Quena_B_.wav',D4:'Quena_D.wav',E4:'Quena_E.wav',G4:'Quena_G.wav',A4:'Quena_A.wav',C5:'Quena_C-.wav',E5:'Quena_E-.wav'};
var IRF={room:'nice_drum_room.wav',hall:'musikvereinsaal.wav',plate:'StudioNordPlate_2sec.wav',cathedral:'scala_milan_opera_hall.wav'};
var IRM={room:5.0,hall:1.8,plate:2.5,cathedral:8.0};
var SMIDI={G3:55,A3:57,B3:59,D4:62,E4:64,G4:67,A4:69,C5:72,E5:76};
var SEM={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
var ALL=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var NES={C:'Do','C#':'Do♯',D:'Re','D#':'Re♯',E:'Mi',F:'Fa','F#':'Fa♯',G:'Sol','G#':'Sol♯',A:'La','A#':'La♯',B:'Si'};
var BP={'C#':0.65,'D#':1.65,'F#':3.65,'G#':4.65,'A#':5.65};
var TOCTS=5,SOCT=2,KWS=[22,26,30,34,38,42,48,54,62,72,84],kwi=7;
var WW=54,BW,KH,pb=0,md=0,rv=0.2,cIR='plate';
var ctx=null,bufs={},irb={},nds={},rcts=[],pts={};
var mwO=0,pwO=0,sx=0,mwC=0,pwC=0;
var dG,wG,cv;

function n2m(n,o){return(o+1)*12+SEM[n];}
function bst(n,o){var m=n2m(n,o),b=null,bd=999;Object.keys(SMIDI).forEach(function(s){var d=Math.abs(SMIDI[s]-m);if(d<bd){bd=d;b=s;}});return{s:b,d:m-SMIDI[b]};}
function gac(){
  if(!ctx){
    ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    var mg=ctx.createGain();mg.gain.value=1;
    dG=ctx.createGain();dG.gain.value=1;
    wG=ctx.createGain();wG.gain.value=rv*IRM[cIR];
    cv=ctx.createConvolver();
    var l=Math.floor(ctx.sampleRate*1.5),bf=ctx.createBuffer(2,l,ctx.sampleRate);
    for(var c=0;c<2;c++){var d=bf.getChannelData(c);for(var i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,1.5);}
    cv.buffer=bf;
    dG.connect(mg);wG.connect(cv);cv.connect(mg);mg.connect(ctx.destination);
    Object.keys(IRF).forEach(function(nm){fetch(IRB+IRF[nm]).then(function(r){return r.arrayBuffer();}).then(function(ab){return ctx.decodeAudioData(ab);}).then(function(b){irb[nm]=b;if(nm===cIR)cv.buffer=b;}).catch(function(){});});
  }
  if(ctx.state==='suspended')ctx.resume();
  return ctx;
}
function loadS(){var c=gac();Object.keys(FILES).forEach(function(n){fetch(BASE+FILES[n]).then(function(r){return r.arrayBuffer();}).then(function(ab){return c.decodeAudioData(ab);}).then(function(b){bufs[n]=b;}).catch(function(){});});}

function play(id,n,o,vel,gl){
  var c=gac();if(nds[id])stp(id);
  var atk=gl?0.005:0.008,m=bst(n,o);
  var g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vel,c.currentTime+atk);
  var lfo=c.createOscillator(),lf=c.createGain(),la=c.createGain();
  lfo.type='sine';lfo.frequency.value=4.5;lf.gain.value=md*0.022;la.gain.value=md*vel*0.14;
  lfo.connect(lf);lfo.connect(la);lfo.start();
  if(bufs[m.s]){
    var src=c.createBufferSource();src.buffer=bufs[m.s];
    var rt=Math.pow(2,(m.d+pb*2)/12);src.playbackRate.value=rt;
    lf.connect(src.playbackRate);la.connect(g.gain);
    src.connect(g);g.connect(dG);g.connect(wG);src.start();
    nds[id]={src:src,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,r:rt,v:vel,s:true};
  } else {
    var f=440*Math.pow(2,(n2m(n,o)-69)/12)*Math.pow(2,pb*2/12);
    var o1=c.createOscillator(),o2=c.createOscillator();
    o1.type='sine';o2.type='triangle';o1.frequency.value=f;o2.frequency.value=f*1.001;
    lf.connect(o1.frequency);lf.connect(o2.frequency);la.connect(g.gain);
    o1.connect(g);o2.connect(g);g.connect(dG);g.connect(wG);o1.start();o2.start();
    nds[id]={o1:o1,o2:o2,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,v:vel,s:false};
  }
  document.getElementById('ndsp').textContent=NES[n]+o;
}
function stp(id){
  var nd=nds[id];if(!nd)return;var c=gac();
  nd.g.gain.cancelScheduledValues(c.currentTime);nd.g.gain.setValueAtTime(nd.g.gain.value,c.currentTime);nd.g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.05);
  var s=nd.src,o1=nd.o1,o2=nd.o2,lfo=nd.lfo;
  setTimeout(function(){try{if(s)s.stop();}catch(e){}try{if(o1)o1.stop();if(o2)o2.stop();}catch(e){}try{if(lfo)lfo.stop();}catch(e){}},80);
  delete nds[id];if(!Object.keys(nds).length)document.getElementById('ndsp').textContent='—';
}
function uV(id,y,t,b){var nd=nds[id];if(!nd||!ctx)return;var p=(y-t)/(b-t),v=Math.max(0.1,Math.min(0.95,0.1+p*0.85));nd.v=v;nd.g.gain.setTargetAtTime(v,ctx.currentTime,0.015);}

function dW(cid,off){
  var c2=document.getElementById(cid);if(!c2)return;
  var dpr=window.devicePixelRatio||1,w=c2.parentElement.clientWidth,h=c2.parentElement.clientHeight;
  c2.width=w*dpr;c2.height=h*dpr;var ct=c2.getContext('2d');ct.scale(dpr,dpr);
  ct.fillStyle='#000';ct.fillRect(0,0,w,h);
  var sp=10,s=((off%sp)+sp)%sp;
  for(var x=s-sp;x<w+sp;x+=sp){var dd=Math.abs(x-w/2)/(w/2),al=Math.max(0.08,0.8-dd*0.75);ct.beginPath();ct.moveTo(x,2);ct.lineTo(x,h-2);ct.strokeStyle='rgba(255,217,0,'+al+')';ct.lineWidth=1.5;ct.stroke();}
}
function mkW(wid,cid,vid,mn,mx,onM,onR){
  var el=document.getElementById(wid),drag=false,pid=null,sx2=0,so=0,lt=0,cur=(mn+mx)/2;
  if(wid==='mw')cur=0;
  el.addEventListener('pointerdown',function(e){
    e.stopPropagation();e.preventDefault();
    var now=Date.now();
    if(now-lt<300&&wid==='mw'){cur=0;md=0;mwO=0;dW(cid,0);document.getElementById(vid).textContent='0';if(ctx)Object.keys(nds).forEach(function(id){var nd=nds[id];if(nd.lf)nd.lf.gain.setTargetAtTime(0,ctx.currentTime,0.04);if(nd.la)nd.la.gain.setTargetAtTime(0,ctx.currentTime,0.04);});lt=0;return;}
    lt=now;drag=true;pid=e.pointerId;sx2=e.clientX;so=wid==='mw'?mwO:pwO;el.setPointerCapture(e.pointerId);
  },{passive:false});
  el.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==pid)return;
    var dx=e.clientX-sx2,nv=Math.max(mn,Math.min(mx,cur+dx*(mx-mn)/100));
    var atL=(nv<=mn&&dx<0)||(nv>=mx&&dx>0);
    if(!atL){if(wid==='mw')mwO=so+dx;else pwO=so+dx;}
    dW(cid,wid==='mw'?mwO:pwO);cur=nv;
    document.getElementById(vid).textContent=wid==='pw'?Math.round(nv*100):Math.round(Math.max(0,nv)*100);
    onM(nv);
  },{passive:false});
  function up(e){if(e.pointerId!==pid)return;drag=false;pid=null;if(onR)onR();}
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',function(e){drag=false;pid=null;if(onR)onR();});
}
mkW('mw','mwc','mwv',0,1,function(v){md=v;if(ctx)Object.keys(nds).forEach(function(id){var nd=nds[id];if(nd.lf)nd.lf.gain.setTargetAtTime(md*0.022,ctx.currentTime,0.04);if(nd.la)nd.la.gain.setTargetAtTime(md*nd.v*0.14,ctx.currentTime,0.04);});},null);
mkW('pw','pwc','pwv',-1,1,function(v){pb=v;if(ctx)Object.keys(nds).forEach(function(id){var nd=nds[id];if(!nd.s)return;var m=bst(nd.n,nd.o),r=Math.pow(2,(m.d+pb*2)/12);nd.src.playbackRate.setTargetAtTime(r,ctx.currentTime,0.005);nd.r=r;});},function(){pb=0;pwO=0;dW('pwc',0);document.getElementById('pwv').textContent='0';if(ctx)Object.keys(nds).forEach(function(id){var nd=nds[id];if(!nd.s)return;nd.src.playbackRate.setTargetAtTime(Math.pow(2,bst(nd.n,nd.o).d/12),ctx.currentTime,0.005);});});

(function(){
  var kn=document.getElementById('rkn'),dot=document.getElementById('rkd'),drag=false,pid=null,sy=0,sa=0,lt=0;
  function sA(a){dot.style.transform='translateX(-50%) rotate('+((-140+a*280))+'deg) translateY(-6px)';}
  sA(rv);
  kn.addEventListener('pointerdown',function(e){e.stopPropagation();e.preventDefault();var now=Date.now();if(now-lt<300){rv=0.2;sA(0.2);document.getElementById('rkv').textContent='20%';if(wG&&ctx)wG.gain.setTargetAtTime(rv*IRM[cIR],ctx.currentTime,0.04);lt=0;return;}lt=now;drag=true;pid=e.pointerId;sy=e.clientY;sa=rv;kn.setPointerCapture(e.pointerId);},{passive:false});
  kn.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==pid)return;rv=Math.max(0,Math.min(1,sa+(sy-e.clientY)/80));sA(rv);document.getElementById('rkv').textContent=Math.round(rv*100)+'%';if(wG&&ctx)wG.gain.setTargetAtTime(rv*IRM[cIR],ctx.currentTime,0.04);},{passive:false});
  kn.addEventListener('pointerup',function(){drag=false;});kn.addEventListener('pointercancel',function(){drag=false;});
})();

document.getElementById('irs').addEventListener('change',function(){cIR=this.value;if(irb[cIR]&&cv)cv.buffer=irb[cIR];if(wG&&ctx)wG.gain.setTargetAtTime(rv*IRM[cIR],ctx.currentTime,0.05);});
document.getElementById('gbt').addEventListener('pointerdown',function(e){e.preventDefault();document.getElementById('bot').style.display='none';document.getElementById('bot2').style.display='flex';},{passive:false});
document.getElementById('xcl').addEventListener('pointerdown',function(e){e.preventDefault();document.getElementById('bot2').style.display='none';document.getElementById('bot').style.display='flex';},{passive:false});

function mkC(u,d,v,mn,mx,st,fl,cb){
  var val=parseFloat(document.getElementById(v).textContent);
  function up(delta){val=fl?Math.round((val+delta)*10)/10:Math.round(val+delta);val=Math.max(mn,Math.min(mx,val));document.getElementById(v).textContent=fl?val.toFixed(1):val;cb(val);}
  document.getElementById(u).addEventListener('pointerdown',function(e){e.preventDefault();up(st);},{passive:false});
  document.getElementById(d).addEventListener('pointerdown',function(e){e.preventDefault();up(-st);},{passive:false});
}
mkC('p3','p1','p2',0,200,5,false,function(){});
mkC('d3','d1','d2',0.3,8,0.1,true,function(){});
mkC('s3','s1','s2',10,100,5,false,function(){});
mkC('a3','a1','a2',0,100,5,false,function(){});
mkC('f3','f1','f2',0,100,5,false,function(){});
mkC('g3','g1','g2',-12,6,0.5,true,function(){});

document.getElementById('mzi').addEventListener('pointerdown',function(e){e.preventDefault();if(kwi<KWS.length-1){kwi++;bKb();}},{passive:false});
document.getElementById('mzo').addEventListener('pointerdown',function(e){e.preventDefault();if(kwi>0){kwi--;bKb();}},{passive:false});

function bKb(){
  var wrap=document.getElementById('kbwrap'),kb=document.getElementById('kb');if(!wrap||!kb)return;
  kb.innerHTML='';WW=KWS[kwi];BW=Math.floor(WW*0.58);KH=wrap.clientHeight-9;
