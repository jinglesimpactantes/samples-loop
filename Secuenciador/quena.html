<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=Michroma&display=swap');
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
body{margin:0;background:#0a0804;display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;touch-action:none;overflow:hidden;}
#minibar{height:26px;flex-shrink:0;background:#0d0b06;border-bottom:1px solid rgba(255,217,0,0.15);display:flex;align-items:center;padding:0 8px;gap:6px;}
.mmz{width:28px;height:22px;background:rgba(255,217,0,0.15);border:1.5px solid rgba(255,217,0,0.5);border-radius:4px;color:#FFD900;font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
#mm-keys{flex:1;height:14px;position:relative;border-radius:3px;overflow:hidden;background:#1a1408;border:1px solid rgba(255,217,0,0.12);}
.mk-w{position:absolute;top:0;bottom:0;background:rgba(220,210,180,0.5);}
.mk-b{position:absolute;top:0;height:60%;background:#111;z-index:2;}
#mm-view{position:absolute;top:0;bottom:0;background:rgba(255,217,0,0.2);border:2px solid #FFD900;border-radius:2px;pointer-events:none;z-index:3;box-shadow:0 0 0 999px rgba(0,0,0,0.45);}
#mm-oct{font-family:'Michroma',sans-serif;font-size:8px;color:#FFD900;flex-shrink:0;}
#kbwrap{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0;}
#kb{position:absolute;top:0;left:0;bottom:0;touch-action:none;}
.w{position:absolute;bottom:3px;top:4px;border-radius:0 0 6px 6px;touch-action:none;box-shadow:0 5px 12px rgba(0,0,0,0.5);}
.b{position:absolute;top:4px;z-index:2;border-radius:0 0 4px 4px;touch-action:none;box-shadow:2px 5px 10px rgba(0,0,0,0.8);height:42%;}
#bot{height:90px;flex-shrink:0;display:flex;align-items:stretch;gap:0;border-top:1px solid rgba(255,217,0,0.12);background:#0a0804;}
#caja{flex:2;min-width:0;border-right:1px solid rgba(255,217,0,0.12);padding:6px 8px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
#lista{width:62px;flex-shrink:0;border-right:1px solid rgba(255,217,0,0.12);display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:4px 0;}
.lbtn{font-family:system-ui,sans-serif;font-size:9px;color:rgba(255,217,0,0.45);cursor:pointer;touch-action:manipulation;padding:3px 6px;border-radius:4px;border:1px solid transparent;width:100%;text-align:center;}
.lbtn.act{color:#0a0804;background:#FFD900;border-color:#FFD900;font-weight:bold;}
#bnr{flex:1;flex-shrink:0;border-right:1px solid rgba(255,217,0,0.12);overflow:hidden;background:#000;position:relative;}
#wfcv{display:block;width:100%;height:100%;}
#trc{width:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
#trc img{width:28px;height:28px;object-fit:contain;}
#pnl-ruedas{display:flex;align-items:center;justify-content:space-around;width:100%;height:100%;}
.whl2{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;}
.wl2{font-family:'Michroma',sans-serif;font-size:6px;letter-spacing:1px;color:rgba(255,217,0,0.55);}
.wb2{width:100%;height:26px;border-radius:4px;background:#000;border:1px solid rgba(255,217,0,0.4);position:relative;overflow:hidden;touch-action:none;}
.wb2 canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
.wc2{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#FFD900;transform:translateX(-50%);z-index:4;pointer-events:none;}
.wv2{font-family:'Michroma',sans-serif;font-size:7px;color:#FFD900;}
#pnl-reverb{display:flex;flex-direction:column;gap:4px;width:100%;}
.rvrow{display:flex;align-items:center;gap:6px;}
.rvlbl{font-family:system-ui,sans-serif;font-size:9px;color:rgba(255,217,0,0.7);flex-shrink:0;width:36px;}
.rvsel{font-family:system-ui,sans-serif;font-size:9px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.3);border-radius:3px;padding:2px 4px;flex:1;touch-action:manipulation;}
.rvsi{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:rgba(255,217,0,0.15);outline:none;touch-action:manipulation;}
.rvsi::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#FFD900;cursor:pointer;border:2px solid #000;}
.byp{font-family:system-ui,sans-serif;font-size:9px;font-weight:bold;padding:2px 6px;border-radius:4px;border:1px solid rgba(255,217,0,0.4);color:rgba(255,217,0,0.4);cursor:pointer;touch-action:manipulation;flex-shrink:0;margin-left:4px;}
.byp.act{background:#FFD900;color:#000;border-color:#FFD900;}
#pnl-delay{display:flex;flex-direction:column;gap:4px;width:100%;}
/* THEME EDITOR */
#thm{position:fixed;left:0;right:0;bottom:0;background:#0a0804;border-top:2px solid rgba(255,217,0,0.3);z-index:100;display:none;flex-direction:column;padding:12px;gap:10px;max-height:70%;}
#thm h3{font-family:'Michroma',sans-serif;font-size:11px;color:#FFD900;letter-spacing:2px;}
.thm-presets{display:flex;gap:6px;flex-wrap:wrap;}
.thm-btn{font-family:system-ui,sans-serif;font-size:10px;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,217,0,0.3);color:#FFD900;background:rgba(255,217,0,0.05);cursor:pointer;touch-action:manipulation;}
.thm-btn.sel{background:#FFD900;color:#000;border-color:#FFD900;}
.thm-custom{display:flex;flex-direction:column;gap:6px;}
.thm-row{display:flex;align-items:center;gap:8px;}
.thm-lbl{font-family:system-ui,sans-serif;font-size:10px;color:rgba(255,217,0,0.7);width:80px;flex-shrink:0;}
.thm-slots{display:flex;gap:4px;flex-wrap:wrap;}
.thm-slot{width:36px;height:36px;border-radius:6px;border:1.5px solid rgba(255,217,0,0.3);cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(255,217,0,0.5);}
.thm-slot.used{border-color:#FFD900;}
#thm-close{align-self:flex-end;font-family:system-ui,sans-serif;font-size:12px;color:#FFD900;padding:4px 12px;border:1px solid rgba(255,217,0,0.3);border-radius:4px;cursor:pointer;touch-action:manipulation;}
</style>
</head>
<body oncontextmenu="return false">
<div id="minibar">
  <div style="display:flex;gap:3px;flex-shrink:0;">
    <div class="mmz" id="mzo">−</div>
    <div class="mmz" id="mzi">+</div>
  </div>
  <div id="mm-keys"><div id="mm-view"></div></div>
  <div id="mm-oct">C4</div>
</div>
<div id="kbwrap"><div id="kb"></div></div>
<div id="bot">
  <div id="caja">
    <div id="pnl-ruedas">
      <div class="whl2">
        <div class="wl2">MOD</div>
        <div class="wb2" id="mw"><canvas id="mwc"></canvas></div>
        <div class="wv2" id="mwv">0</div>
      </div>
      <div style="width:10px;"></div>
      <div class="whl2">
        <div class="wl2">PITCH</div>

      <div class="rvrow">
        <span class="rvlbl">BPM</span>
        <input id="dlbpm" type="number" min="40" max="240" value="120" style="width:52px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.3);border-radius:3px;font-size:12px;padding:2px 4px;text-align:center;"/>
        <select id="dlsub" style="font-size:9px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.3);border-radius:3px;padding:2px 4px;margin-left:4px;flex:1;">
          <option value="4">1/4 (largo)</option>
          <option value="4d">1/4. (med-largo)</option>

  <div id="lista">
    <div class="lbtn act" id="btn-ruedas">RUEDAS</div>
    <div class="lbtn" id="btn-reverb">REVERB</div>
    <div class="lbtn" id="btn-delay">DELAY</div>
  </div>
  <div id="bnr"><canvas id="wfcv"></canvas></div>
  <div id="trc"><img src="https://jinglesimpactantes.github.io/samples-loop/Secuenciador/TuercaIcono.png" alt="⚙"/></div>
</div>

<!-- THEME EDITOR -->
<div id="thm">
  <h3>THEME EDITOR</h3>
  <div class="thm-presets">
    <div class="thm-btn sel" id="thm-classic">CLASSIC</div>
    <div class="thm-btn" id="thm-dark">DARK</div>
    <div class="thm-btn" id="thm-red">RED/BLACK</div>
    <div class="thm-btn" id="thm-wood">WOOD</div>

  </div>

    <div class="thm-row">
      <span class="thm-lbl">Tecla blanca</span>
      <input type="color" id="thm-wc1" value="#f8f4ea" style="width:36px;height:28px;border:none;background:none;cursor:pointer;"/>
      <input type="color" id="thm-wc2" value="#c8c0a8" style="width:36px;height:28px;border:none;background:none;cursor:pointer;"/>
    </div>
    <div class="thm-row">
      <span class="thm-lbl">Tecla negra</span>
      <input type="color" id="thm-bc1" value="#333333" style="width:36px;height:28px;border:none;background:none;cursor:pointer;"/>
      <input type="color" id="thm-bc2" value="#111111" style="width:36px;height:28px;border:none;background:none;cursor:pointer;"/>
    </div>
    <div style="font-family:system-ui,sans-serif;font-size:9px;color:rgba(255,217,0,0.6);">GUARDAR EN SLOT:</div>
    <div class="thm-slots" id="thm-slots"></div>
  </div>
  <div id="thm-close">✕ CERRAR</div>
</div>

<script>
var BASE='https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/';
var IRB='https://jinglesimpactantes.github.io/samples-loop/IR/';
var FILES={G3:'Quena_G_.wav',A3:'Quena_A_.wav',B3:'Quena_B_.wav',D4:'Quena_D.wav',E4:'Quena_E.wav',G4:'Quena_G.wav',A4:'Quena_A.wav',C5:'Quena_C-.wav',E5:'Quena_E-.wav'};
var IRF={room:'nice_drum_room.wav',hall:'musikvereinsaal.wav',plate:'StudioNordPlate_2sec.wav',cathedral:'scala_milan_opera_hall.wav'};
var IRM={room:5.0,hall:1.8,plate:2.5,cathedral:8.0};
var SMIDI={G3:55,A3:57,B3:59,D4:62,E4:64,G4:67,A4:69,C5:72,E5:76};
var SEM={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
var ALL=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var NES={C:'Do','C#':'Do♯',D:'Re','D#':'Re♯',E:'Mi',F:'Fa','F#':'Fa♯',G:'Sol','G#':'Sol♯',A:'La','A#':'La♯',B:'Si'};
var BP={'C#':0.65,'D#':1.65,'F#':3.65,'G#':4.65,'A#':5.65};
var TOCTS=5,SOCT=2,KWS=[22,26,30,34,38,42,48,54,62,72,84],kwi=7;
var WW=54,BW,KH,pb=0,md=0,rv=0.18,cIR='plate';
var ctx=null,bufs={},irb={},nds={},rcts=[],pts={};
var mwO=0,pwO=0,sx=0;
var dG,wG,cvR;
var rvOn=true,dlOn=true;

// THEMES
var THEMES={
  classic:{wTop:'#f8f4ea',wBot:'#c8c0a8',bTop:'#333',bBot:'#111',wOn:'#FFD900',bOn:'#b8a800'},
  dark:{wTop:'#555',wBot:'#333',bTop:'#111',bBot:'#000',wOn:'#FFD900',bOn:'#b8a800'},
  red:{wTop:'#cc2200',wBot:'#8b1500',bTop:'#111',bBot:'#000',wOn:'#ff4400',bOn:'#cc2200'},
  wood:{wTop:'#d4a96a',wBot:'#8b6340',bTop:'#3d2010',bBot:'#1a0a00',wOn:'#FFD900',bOn:'#b8a800'},
  simple:{wTop:'#ffffff',wBot:'#ffffff',bTop:'#000000',bBot:'#000000',wOn:'#FFD900',bOn:'#b8a800'}
};
var curTheme=THEMES.classic;
var customSlots=JSON.parse(localStorage.getItem('qthm')||'{}');

function applyTheme(t){
  curTheme=t;
  var all=document.querySelectorAll('.w,.b');
  for(var i=0;i<all.length;i++){
    var el=all[i];
    if(el.classList.contains('w')){
      el.style.background='linear-gradient(180deg,'+t.wTop+','+t.wBot+')';
    } else {
      el.style.background='linear-gradient(180deg,'+t.bTop+','+t.bBot+')';
    }
  }
}

function setKeyColor(el){
  var t=curTheme;
  if(el.classList.contains('w')){
    el.style.background=el.classList.contains('on')?
      'linear-gradient(180deg,'+t.wOn+',#ffd000)':
      'linear-gradient(180deg,'+t.wTop+','+t.wBot+')';
  } else {
    el.style.background=el.classList.contains('on')?
      'linear-gradient(180deg,'+t.bOn+',#FFD900)':
      'linear-gradient(180deg,'+t.bTop+','+t.bBot+')';
  }
}

// AUDIO
function n2m(n,o){return(o+1)*12+SEM[n];}
function bst(n,o){var m=n2m(n,o),b=null,bd=999;Object.keys(SMIDI).forEach(function(s){var d=Math.abs(SMIDI[s]-m);if(d<bd){bd=d;b=s;}});return{s:b,d:m-SMIDI[b]};}
function gac(){
  if(!ctx){
    try{ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});}catch(e){ctx=new(window.AudioContext||window.webkitAudioContext)();}
    var mg=ctx.createGain();mg.gain.value=1;
    dG=ctx.createGain();dG.gain.value=1;
    wG=ctx.createGain();wG.gain.value=rv*IRM[cIR];
    cvR=ctx.createConvolver();
    var l=Math.floor(ctx.sampleRate*1.5),bf=ctx.createBuffer(2,l,ctx.sampleRate);
    for(var c=0;c<2;c++){var da=bf.getChannelData(c);for(var i=0;i<l;i++)da[i]=(Math.random()*2-1)*Math.pow(1-i/l,1.5);}
    cvR.buffer=bf;
    dG.connect(mg);wG.connect(cvR);cvR.connect(mg);mg.connect(ctx.destination);
    Object.keys(IRF).forEach(function(nm){var n=nm;fetch(IRB+IRF[n]).then(function(r){return r.arrayBuffer();}).then(function(ab){return ctx.decodeAudioData(ab);}).then(function(b){irb[n]=b;if(n===cIR)cvR.buffer=b;}).catch(function(){});});
  }
  if(ctx.state==='suspended')ctx.resume();
  return ctx;
}
function loadS(){var c=gac();Object.keys(FILES).forEach(function(n){var nL=n;fetch(BASE+FILES[nL]).then(function(r){return r.arrayBuffer();}).then(function(ab){return c.decodeAudioData(ab);}).then(function(b){bufs[nL]=b;}).catch(function(){});});}
function play(id,n,o,vel,gl){
  var c=gac();if(nds[id])stp(id);
  var atk=gl?0.005:0.008,m=bst(n,o);
  var g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vel,c.currentTime+atk);
  var lfo=c.createOscillator(),lf=c.createGain(),la=c.createGain();
  lfo.type='sine';lfo.frequency.value=4.5;lf.gain.value=md*0.022;la.gain.value=md*vel*0.14;
  lfo.connect(lf);lfo.connect(la);lfo.start();
  if(bufs[m.s]){
    var src=c.createBufferSource();src.buffer=bufs[m.s];
    var rt=Math.pow(2,(m.d+pb*2)/12);src.playbackRate.value=rt;
    lf.connect(src.playbackRate);la.connect(g.gain);
    src.connect(g);g.connect(dG);g.connect(wG);src.start();
    nds[id]={src:src,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,r:rt,v:vel,s:true};
  } else {
    var f=440*Math.pow(2,(n2m(n,o)-69)/12)*Math.pow(2,pb*2/12);
    var o1=c.createOscillator(),o2=c.createOscillator();
    o1.type='sine';o2.type='triangle';o1.frequency.value=f;o2.frequency.value=f*1.001;
    lf.connect(o1.frequency);lf.connect(o2.frequency);la.connect(g.gain);
    o1.connect(g);o2.connect(g);g.connect(dG);g.connect(wG);o1.start();o2.start();
    nds[id]={o1:o1,o2:o2,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,v:vel,s:false};
  }
  document.getElementById('ndsp')?document.getElementById('ndsp').textContent=NES[n]+o:null;
}
function stp(id){
  var nd=nds[id];if(!nd)return;var c=gac();
  nd.g.gain.cancelScheduledValues(c.currentTime);nd.g.gain.setValueAtTime(nd.g.gain.value,c.currentTime);nd.g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.05);
  var s=nd.src,o1=nd.o1,o2=nd.o2,lfo=nd.lfo;
  setTimeout(function(){try{if(s)s.stop();}catch(e){}try{if(o1)o1.stop();if(o2)o2.stop();}catch(e){}try{if(lfo)lfo.stop();}catch(e){}},80);
  delete nds[id];
}
function uV(id,y,t,b){var nd=nds[id];if(!nd||!ctx)return;var p=(y-t)/(b-t),v=Math.max(0.1,Math.min(0.95,0.1+p*0.85));nd.v=v;nd.g.gain.setTargetAtTime(v,ctx.currentTime,0.015);}

// WHEEL DRAW
function dW(cid,off){
  var c2=document.getElementById(cid);if(!c2)return;
  var par=c2.parentElement,w=par.offsetWidth,h=par.offsetHeight;if(!w||!h)return;
  c2.width=w;c2.height=h;c2.style.width=w+'px';c2.style.height=h+'px';
  var ct=c2.getContext('2d');ct.fillStyle='#000';ct.fillRect(0,0,w,h);
  var sp=10,s=((off%sp)+sp)%sp;
  for(var x=s-sp;x<w+sp;x+=sp){var dd=Math.abs(x-w/2)/(w/2),al=Math.max(0.08,0.8-dd*0.75);ct.beginPath();ct.moveTo(x,2);ct.lineTo(x,h-2);ct.strokeStyle='rgba(255,217,0,'+al+')';ct.lineWidth=1.5;ct.stroke();}
}
function mkW(wid,cid,vid,mn,mx,onM,onR){
  var el=document.getElementById(wid),drag=false,pid=null,sx2=0,so=0,lt=0,cur=wid==='mw'?0:(mn+mx)/2;
  el.addEventListener('pointerdown',function(e){e.stopPropagation();e.preventDefault();var now=Date.now();if(now-lt<300&&wid==='mw'){cur=0;md=0;mwO=0;dW(cid,0);document.getElementById(vid).textContent='0';if(ctx)Object.keys(nds).forEach(function(id){var nd=nds[id];if(nd.lf)nd.lf.gain.setTargetAtTime(0,ctx.currentTime,0.04);if(nd.la)nd.la.gain.setTargetAtTime(0,ctx.currentTime,0.04);});lt=0;return;}lt=now;drag=true;pid=e.pointerId;sx2=e.clientX;so=wid==='mw'?mwO:pwO;try{el.setPointerCapture(e.pointerId);}catch(ex){}},{passive:false});

// REVERB PRESETS
var PRESETS={
  plate:{predly:40,decay:3.3,size:70,damp:40,diff:45,gain:-2.0,mix:18},
  hall:{predly:0,decay:3.3,size:50,damp:20,diff:50,gain:1.0,mix:18},
  room:{predly:50,decay:5.7,size:30,damp:35,diff:70,gain:-7.0,mix:18},
  cathedral:{predly:25,decay:8.0,size:100,damp:50,diff:60,gain:-2.0,mix:18}
};
var RP={predly:40,decay:3.3,size:70,damp:40,diff:45,gain:-2.0};
function applyIR(){
  if(!ctx||!irb[cIR])return;
  var src=irb[cIR],sr=ctx.sampleRate,gainLin=Math.pow(10,RP.gain/20);
  var srcLen=src.length,newLen=Math.floor(srcLen*(RP.size/100)*(RP.decay/2));
  if(newLen<256)newLen=256;
  var preLen=Math.floor((RP.predly/1000)*sr),totalLen=preLen+newLen;
  var nb=ctx.createBuffer(2,totalLen,sr);
  for(var ch=0;ch<2;ch++){
    var srcD=src.getChannelData(ch<src.numberOfChannels?ch:0),dst=nb.getChannelData(ch);
    for(var i=0;i<totalLen;i++){
      var si=i-preLen;if(si<0){dst[i]=0;continue;}
      var srcI=Math.floor(si*(srcLen/newLen));if(srcI>=srcLen){dst[i]=0;continue;}
      var env=Math.pow(1-si/newLen,RP.decay*0.5+0.5);
      var dampF=1-(RP.damp/100)*(si/newLen)*0.8;
      var diffV=srcD[srcI]*(1-RP.diff/100)+((srcI>0?srcD[srcI-1]:0)*(RP.diff/100));
      dst[i]=diffV*env*dampF*gainLin;
    }
  }
  cvR.buffer=nb;
}
function loadPreset(ir){
  var p=PRESETS[ir];if(!p)return;
  RP.predly=p.predly;RP.decay=p.decay;RP.size=p.size;RP.damp=p.damp;RP.diff=p.diff;RP.gain=p.gain;
  rv=p.mix/100;
  var irScale=(ir==='cathedral')?0.2:1.0;
  if(wG&&ctx){var gL=Math.pow(10,p.gain/20);wG.gain.setTargetAtTime(rv*IRM[ir]*gL*irScale,ctx.currentTime,0.05);}
  var mx=document.getElementById('rvmix'),mxv=document.getElementById('rvmixv');
  if(mx){mx.value=p.mix;mxv.textContent=p.mix+'%';}
  setTimeout(applyIR,100);
}

document.getElementById('rvmix').addEventListener('input',function(){

var dlNode=null,dlWet=null;
function initDelay(){
  if(dlNode||!ctx)return;
  dlNode=ctx.createDelay(2.0);

  var dlFilt=ctx.createBiquadFilter();dlFilt.type='lowpass';dlFilt.frequency.value=2800;dlFilt.Q.value=0.5;
  dlWet=ctx.createGain();dlWet.gain.value=0;
  dG.connect(dlNode);dlNode.connect(dlFilt);dlFilt.connect(dlFb);dlFb.connect(dlNode);dlNode.connect(dlWet);dlWet.connect(ctx.destination);
  dlNode.delayTime.value=getDlTime();
}
function getDlTime(){
  var bpm=parseFloat(document.getElementById('dlbpm').value)||120;
  var sub=document.getElementById('dlsub').value,beat=60/bpm;
  if(sub==='4')return Math.min(beat,2.0);
  if(sub==='4d')return Math.min(beat*1.5,2.0);
  if(sub==='6')return Math.min(beat*2/3,2.0);
  return Math.min(beat*0.5,2.0);
}

function bKb(){

  sx=Math.max(0,(4-SOCT)*7*(WW+2));aS();

function aS(){var w=document.getElementById('kbwrap');if(!w)return;var mx=TOCTS*7*(WW+2)-w.clientWidth;sx=Math.max(0,Math.min(mx||0,sx));document.getElementById('kb').style.transform='translateX(-'+sx+'px)';uMM();}
function bR(){rcts=[];var all=document.querySelectorAll('.w,.b');for(var i=0;i<all.length;i++){var r=all[i].getBoundingClientRect();rcts.push({id:all[i].dataset.id,b:all[i].classList.contains('b'),l:r.left,r:r.right,t:r.top,bo:r.bottom});}}
function bMM(){var mk=document.getElementById('mm-keys');if(!mk)return;mk.innerHTML='<div id="mm-view"></div>';var mkW=mk.clientWidth,tot=TOCTS*7*(WW+2),sc=mkW/tot;for(var oi=0;oi<TOCTS;oi++){var wi=0;for(var i=0;i<ALL.length;i++){var n=ALL[i];if(n.indexOf('#')>=0){var d2=document.createElement('div');d2.className='mk-b';d2.style.left=((oi*7+(BP[n]||0))*(WW+2)*sc)+'px';d2.style.width=Math.max(1,BW*sc)+'px';mk.appendChild(d2);}else{var d=document.createElement('div');d.className='mk-w';d.style.left=((oi*7+wi)*(WW+2)*sc)+'px';d.style.width=Math.max(1,(WW+2)*sc-0.5)+'px';mk.appendChild(d);wi++;}}}uMM();}

(function(){var mb=document.getElementById('minibar'),drag=false,pid=null,sx2=0,so=0,lt=0;mb.addEventListener('pointerdown',function(e){var mk=document.getElementById('mm-keys'),r=mk.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right)return;var now=Date.now();if(now-lt<300){kwi=7;sx=Math.max(0,(4-SOCT)*7*(KWS[kwi]+2));bKb();lt=0;return;}lt=now;e.preventDefault();drag=true;pid=e.pointerId;sx2=e.clientX;so=sx;try{mb.setPointerCapture(e.pointerId);}catch(ex){}},{passive:false});mb.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==pid)return;var mk=document.getElementById('mm-keys'),tot=TOCTS*7*(WW+2);sx=so+(e.clientX-sx2)*(tot/mk.clientWidth);aS();setTimeout(bR,30);},{passive:false});mb.addEventListener('pointerup',function(){drag=false;});mb.addEventListener('pointercancel',function(){drag=false;});})();

// WAVEFORM
var analyser=null,wfBuf=null;
function initWF(){var c=document.getElementById('wfcv'),p=c.parentElement;c.width=p.offsetWidth;c.height=p.offsetHeight;}
function startWF(){
  if(!ctx||analyser)return;
  analyser=ctx.createAnalyser();analyser.fftSize=256;wfBuf=new Uint8Array(analyser.fftSize);
  dG.connect(analyser);drawWF();
}
function drawWF(){
  requestAnimationFrame(drawWF);
  var c=document.getElementById('wfcv');if(!c)return;
  var W=c.width,H=c.height,ct=c.getContext('2d');
  ct.fillStyle='#000';ct.fillRect(0,0,W,H);
  if(!analyser)return;
  analyser.getByteTimeDomainData(wfBuf);
  ct.beginPath();ct.strokeStyle='#FFD900';ct.lineWidth=1.5;
  var sl=W/wfBuf.length;
  for(var i=0;i<wfBuf.length;i++){var y=H/2+(wfBuf[i]-128)/128*(H/2*0.85);i===0?ct.moveTo(0,y):ct.lineTo(i*sl,y);}
  ct.stroke();
}
