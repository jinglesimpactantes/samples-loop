<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=Michroma&display=swap');
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
body{margin:0;background:#0a0804;display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;touch-action:none;overflow:hidden;}
#minibar{height:26px;flex-shrink:0;background:#0d0b06;border-bottom:1px solid rgba(255,217,0,0.15);display:flex;align-items:center;padding:0 8px;gap:6px;}
.mmz{width:28px;height:22px;background:rgba(255,217,0,0.15);border:1.5px solid rgba(255,217,0,0.5);border-radius:4px;color:#FFD900;font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
#mm-keys{flex:1;height:14px;position:relative;border-radius:3px;overflow:hidden;background:#1a1408;border:1px solid rgba(255,217,0,0.12);}
.mk-w{position:absolute;top:0;bottom:0;background:rgba(220,210,180,0.5);}
.mk-b{position:absolute;top:0;height:60%;background:#111;z-index:2;}
#mm-view{position:absolute;top:0;bottom:0;background:rgba(255,217,0,0.2);border:2px solid #FFD900;border-radius:2px;pointer-events:none;z-index:3;box-shadow:0 0 0 999px rgba(0,0,0,0.45);}
#mm-oct{font-family:'Michroma',sans-serif;font-size:8px;color:#FFD900;flex-shrink:0;}
#kbwrap{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0;}
#kb{position:absolute;top:0;left:0;bottom:0;touch-action:none;}
.w{position:absolute;bottom:3px;top:4px;background:linear-gradient(135deg,rgba(255,255,255,0.5) 0%,transparent 35%),linear-gradient(180deg,#c8c0a8,#f8f4ea);border:1px solid rgba(0,0,0,0.2);border-radius:0 0 6px 6px;touch-action:none;box-shadow:0 5px 12px rgba(0,0,0,0.5);}
.w.on{background:linear-gradient(180deg,#b8a800,#FFD900);box-shadow:0 0 16px rgba(255,217,0,0.6);}
.b{position:absolute;top:4px;z-index:2;background:linear-gradient(180deg,#111,#222);border-radius:0 0 4px 4px;touch-action:none;box-shadow:2px 5px 10px rgba(0,0,0,0.8);height:42%;}
.b.on{background:linear-gradient(180deg,#2a1e00,#FFD900);box-shadow:0 0 14px rgba(255,217,0,0.6);}
#bot{height:90px;flex-shrink:0;display:flex;align-items:stretch;gap:0;border-top:1px solid rgba(255,217,0,0.12);background:#0a0804;}
/* CAJA */
#caja{flex:2;min-width:0;border-right:1px solid rgba(255,217,0,0.12);padding:6px 8px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
/* LISTA */
#lista{width:62px;flex-shrink:0;border-right:1px solid rgba(255,217,0,0.12);display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:4px 0;}
.lbtn{font-family:system-ui,sans-serif;font-size:9px;color:rgba(255,217,0,0.45);letter-spacing:0.5px;cursor:pointer;touch-action:manipulation;padding:3px 6px;border-radius:4px;border:1px solid transparent;width:100%;text-align:center;}
.lbtn.act{color:#0a0804;background:#FFD900;border-color:#FFD900;font-weight:bold;}
/* BANNER */
#bnr{flex-shrink:0;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(255,217,0,0.12);overflow:hidden;}
#bnr img{height:100%;width:auto;object-fit:contain;display:block;}
/* TUERCA */
#trc{width:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
#trc img{width:28px;height:28px;object-fit:contain;}
/* PANEL RUEDAS */
#pnl-ruedas{display:flex;align-items:center;justify-content:space-around;width:100%;height:100%;}
.whl2{display:flex;flex-direction:column;align-items:center;gap:1px;flex:1;}
.wl2{font-family:'Michroma',sans-serif;font-size:6px;letter-spacing:1px;color:rgba(255,217,0,0.55);}
.wb2{width:100%;height:26px;border-radius:4px;background:#000;border:1px solid rgba(255,217,0,0.4);position:relative;overflow:hidden;touch-action:none;}
.wb2 canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
.wc2{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#FFD900;transform:translateX(-50%);z-index:4;pointer-events:none;}
.wv2{font-family:'Michroma',sans-serif;font-size:7px;color:#FFD900;}
/* PANEL REVERB */
#pnl-reverb{display:flex;flex-direction:column;gap:4px;width:100%;}
.rvrow{display:flex;align-items:center;gap:6px;}
.rvlbl{font-family:system-ui,sans-serif;font-size:9px;color:rgba(255,217,0,0.7);flex-shrink:0;width:36px;}
.rvsel{font-family:system-ui,sans-serif;font-size:9px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.3);border-radius:3px;padding:2px 4px;flex:1;touch-action:manipulation;}
.rvsi{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;background:rgba(255,217,0,0.15);outline:none;touch-action:manipulation;}
.rvsi::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#FFD900;cursor:pointer;border:2px solid #000;}
#rvgbt{width:22px;height:22px;background:rgba(255,217,0,0.08);border:1px solid rgba(255,217,0,0.3);border-radius:4px;color:#FFD900;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;flex-shrink:0;margin-left:4px;}
/* PANEL DELAY */
#pnl-delay{display:flex;flex-direction:column;gap:4px;width:100%;}

</style>
</head>
<body oncontextmenu="return false">

</div>
<div id="kbwrap"><div id="kb"></div></div>
<div id="bot">
  <!-- CAJA -->
  <div id="caja">
    <!-- Panel Ruedas (default) -->

      <div class="whl2">

        <div class="wl2">PITCH</div>
        <div class="wb2" id="pw"><canvas id="pwc"></canvas><div class="wc2"></div></div>
        <div class="wv2" id="pwv">0</div>

    <div id="pnl-reverb" style="display:none;position:relative;flex-direction:column;gap:4px;width:100%;">

        <div class="rvrow"><span class="rvlbl">PRE-DLY</span><input class="rvsi" id="p2" type="range" min="0" max="200" step="5" value="40"/><span class="rvsv" id="p2v">40ms</span></div>
        <div class="rvrow"><span class="rvlbl">DECAY</span><input class="rvsi" id="d2" type="range" min="0.3" max="8" step="0.1" value="3.3"/><span class="rvsv" id="d2v">3.3s</span></div>
        <div class="rvrow"><span class="rvlbl">SIZE</span><input class="rvsi" id="s2" type="range" min="10" max="100" step="5" value="70"/><span class="rvsv" id="s2v">70</span></div>
        <div class="rvrow"><span class="rvlbl">DAMP</span><input class="rvsi" id="a2" type="range" min="0" max="100" step="5" value="40"/><span class="rvsv" id="a2v">40%</span></div>
        <div class="rvrow"><span class="rvlbl">DIFF</span><input class="rvsi" id="f2" type="range" min="0" max="100" step="5" value="45"/><span class="rvsv" id="f2v">45</span></div>
        <div class="rvrow"><span class="rvlbl">GAIN</span><input class="rvsi" id="g2" type="range" min="-12" max="6" step="0.5" value="-2"/><span class="rvsv" id="g2v">-2.0dB</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px;">
          <div id="rvcpy" style="font-family:system-ui,sans-serif;font-size:9px;color:#0a0804;background:#FFD900;border-radius:4px;padding:3px 8px;cursor:pointer;touch-action:manipulation;">📋 COPIAR</div>
          <div id="rvcls" style="color:#FFD900;font-size:13px;padding:2px 8px;cursor:pointer;touch-action:manipulation;">✕</div>
        </div>
      </div>
    </div>
    <!-- Panel Delay -->
    <div id="pnl-delay" style="display:none;flex-direction:column;gap:4px;width:100%;">
      <div class="rvrow">
        <span class="rvlbl">MIX</span>
        <input class="rvsi" id="dlmix" type="range" min="0" max="100" step="1" value="0"/>

      </div>
      <div class="rvrow">
        <span class="rvlbl">BPM</span>
        <input id="dlbpm" type="number" min="40" max="240" value="120" style="width:52px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.3);border-radius:3px;font-size:12px;padding:2px 4px;text-align:center;"/>
        <select id="dlsub" style="font-size:9px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.3);border-radius:3px;padding:2px 3px;margin-left:4px;">
          <option value="4">1/4</option>
          <option value="8" selected>1/8</option>
          <option value="16">1/16</option>
          <option value="2">1/2</option>
        </select>
      </div>
    </div>
  </div>
  <!-- LISTA -->
  <div id="lista">
    <div class="lbtn act" id="btn-ruedas">RUEDAS</div>
    <div class="lbtn" id="btn-reverb">REVERB</div>
    <div class="lbtn" id="btn-delay">DELAY</div>
  </div>
  <!-- BANNER -->
  <div id="bnr"><img src="https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/Quena_Banner.jpg" alt=""/></div>
  <!-- TUERCA -->
  <div id="trc"><img src="https://jinglesimpactantes.github.io/samples-loop/Secuenciador/TuercaIcono.png" alt=""/></div>
</div>
<script>
var BASE='https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/';
var IRB='https://jinglesimpactantes.github.io/samples-loop/IR/';
var FILES={G3:'Quena_G_.wav',A3:'Quena_A_.wav',B3:'Quena_B_.wav',D4:'Quena_D.wav',E4:'Quena_E.wav',G4:'Quena_G.wav',A4:'Quena_A.wav',C5:'Quena_C-.wav',E5:'Quena_E-.wav'};
var IRF={room:'nice_drum_room.wav',hall:'musikvereinsaal.wav',plate:'StudioNordPlate_2sec.wav',cathedral:'scala_milan_opera_hall.wav'};
var IRM={room:5.0,hall:1.8,plate:2.5,cathedral:8.0};
var SMIDI={G3:55,A3:57,B3:59,D4:62,E4:64,G4:67,A4:69,C5:72,E5:76};
var SEM={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
var ALL=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var NES={C:'Do','C#':'Do♯',D:'Re','D#':'Re♯',E:'Mi',F:'Fa','F#':'Fa♯',G:'Sol','G#':'Sol♯',A:'La','A#':'La♯',B:'Si'};
var BP={'C#':0.65,'D#':1.65,'F#':3.65,'G#':4.65,'A#':5.65};
var TOCTS=5,SOCT=2,KWS=[22,26,30,34,38,42,48,54,62,72,84],kwi=7;
var WW=54,BW,KH,pb=0,md=0,rv=0.2,cIR='plate';
var ctx=null,bufs={},irb={},nds={},rcts=[],pts={};
var mwO=0,pwO=0,sx=0;
var dG,wG,cv;
function n2m(n,o){return(o+1)*12+SEM[n];}
function bst(n,o){var m=n2m(n,o),b=null,bd=999;Object.keys(SMIDI).forEach(function(s){var d=Math.abs(SMIDI[s]-m);if(d<bd){bd=d;b=s;}});return{s:b,d:m-SMIDI[b]};}
function gac(){
  if(!ctx){
    try{ctx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});}catch(e){ctx=new(window.AudioContext||window.webkitAudioContext)();}
    var mg=ctx.createGain();mg.gain.value=1;
    dG=ctx.createGain();dG.gain.value=1;
    wG=ctx.createGain();wG.gain.value=rv*IRM[cIR];
    cv=ctx.createConvolver();
    var l=Math.floor(ctx.sampleRate*1.5),bf=ctx.createBuffer(2,l,ctx.sampleRate);
    for(var c=0;c<2;c++){var d=bf.getChannelData(c);for(var i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,1.5);}
    cv.buffer=bf;
    dG.connect(mg);wG.connect(cv);cv.connect(mg);mg.connect(ctx.destination);
    Object.keys(IRF).forEach(function(nm){var n=nm;fetch(IRB+IRF[n]).then(function(r){return r.arrayBuffer();}).then(function(ab){return ctx.decodeAudioData(ab);}).then(function(b){irb[n]=b;if(n===cIR)cv.buffer=b;}).catch(function(){});});
  }
  if(ctx.state==='suspended')ctx.resume();
  return ctx;
}
function loadS(){var c=gac();Object.keys(FILES).forEach(function(n){var nL=n;fetch(BASE+FILES[nL]).then(function(r){return r.arrayBuffer();}).then(function(ab){return c.decodeAudioData(ab);}).then(function(b){bufs[nL]=b;}).catch(function(){});});}
function play(id,n,o,vel,gl){
  var c=gac();if(nds[id])stp(id);
  var atk=gl?0.005:0.008,m=bst(n,o);
  var g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vel,c.currentTime+atk);
  var lfo=c.createOscillator(),lf=c.createGain(),la=c.createGain();
  lfo.type='sine';lfo.frequency.value=4.5;lf.gain.value=md*0.022;la.gain.value=md*vel*0.14;
  lfo.connect(lf);lfo.connect(la);lfo.start();
  if(bufs[m.s]){
    var src=c.createBufferSource();src.buffer=bufs[m.s];
    var rt=Math.pow(2,(m.d+pb*2)/12);src.playbackRate.value=rt;
    lf.connect(src.playbackRate);la.connect(g.gain);
    src.connect(g);g.connect(dG);g.connect(wG);src.start();
    nds[id]={src:src,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,r:rt,v:vel,s:true};
  } else {
    var f=440*Math.pow(2,(n2m(n,o)-69)/12)*Math.pow(2,pb*2/12);
    var o1=c.createOscillator(),o2=c.createOscillator();
    o1.type='sine';o2.type='triangle';o1.frequency.value=f;o2.frequency.value=f*1.001;
    lf.connect(o1.frequency);lf.connect(o2.frequency);la.connect(g.gain);
    o1.connect(g);o2.connect(g);g.connect(dG);g.connect(wG);o1.start();o2.start();
    nds[id]={o1:o1,o2:o2,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,v:vel,s:false};
  }
  document.getElementById('ndsp').textContent=NES[n]+o;
}
function stp(id){
  var nd=nds[id];if(!nd)return;var c=gac();
  nd.g.gain.cancelScheduledValues(c.currentTime);nd.g.gain.setValueAtTime(nd.g.gain.value,c.currentTime);nd.g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.05);
  var s=nd.src,o1=nd.o1,o2=nd.o2,lfo=nd.lfo;
  setTimeout(function(){try{if(s)s.stop();}catch(e){}try{if(o1)o1.stop();if(o2)o2.stop();}catch(e){}try{if(lfo)lfo.stop();}catch(e){}},80);
  delete nds[id];if(!Object.keys(nds).length)document.getElementById('ndsp').textContent='—';
}
function uV(id,y,t,b){var nd=nds[id];if(!nd||!ctx)return;var p=(y-t)/(b-t),v=Math.max(0.1,Math.min(0.95,0.1+p*0.85));nd.v=v;nd.g.gain.setTargetAtTime(v,ctx.currentTime,0.015);}
function dW(cid,off){
  var c2=document.getElementById(cid);if(!c2)return;
  var par=c2.parentElement,w=par.offsetWidth,h=par.offsetHeight;
  if(!w||!h)return;
  c2.width=w;c2.height=h;
  var ct=c2.getContext('2d');
  ct.fillStyle='#000';ct.fillRect(0,0,w,h);
  var sp=10,s=((off%sp)+sp)%sp;
  for(var x=s-sp;x<w+sp;x+=sp){var dd=Math.abs(x-w/2)/(w/2),al=Math.max(0.08,0.8-dd*0.75);ct.beginPath();ct.moveTo(x,2);ct.lineTo(x,h-2);ct.strokeStyle='rgba(255,217,0,'+al+')';ct.lineWidth=1.5;ct.stroke();}
}
function mkW(wid,cid,vid,mn,mx,onM,onR){
  var el=document.getElementById(wid),drag=false,pid=null,sx2=0,so=0,lt=0,cur=(mn+mx)/2;
  if(wid==='mw')cur=0;
  el.addEventListener('pointerdown',function(e){
    e.stopPropagation();e.preventDefault();
    var now=Date.now();
    if(now-lt<300&&wid==='mw'){cur=0;md=0;mwO=0;dW(cid,0);document.getElementById(vid).textContent='0';if(ctx)Object.keys(nds).forEach(function(id){var nd=nds[id];if(nd.lf)nd.lf.gain.setTargetAtTime(0,ctx.currentTime,0.04);if(nd.la)nd.la.gain.setTargetAtTime(0,ctx.currentTime,0.04);});lt=0;return;}
    lt=now;drag=true;pid=e.pointerId;sx2=e.clientX;so=wid==='mw'?mwO:pwO;
    try{el.setPointerCapture(e.pointerId);}catch(ex){}
  },{passive:false});
  el.addEventListener('pointermove',function(e){
    if(!drag||e.pointerId!==pid)return;
    var dx=e.clientX-sx2,nv=Math.max(mn,Math.min(mx,cur+dx*(mx-mn)/100));
    var atL=(nv<=mn&&dx<0)||(nv>=mx&&dx>0);
    if(!atL){if(wid==='mw')mwO=so+dx;else pwO=so+dx;}
    dW(cid,wid==='mw'?mwO:pwO);cur=nv;
    document.getElementById(vid).textContent=wid==='pw'?Math.round(nv*100):Math.round(Math.max(0,nv)*100);
    onM(nv);
  },{passive:false});
  function up(e){if(e.pointerId!==pid)return;drag=false;pid=null;if(onR)onR();}
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',function(e){drag=false;pid=null;if(onR)onR();});
}
mkW('mw','mwc','mwv',0,1,function(v){md=v;if(ctx)Object.keys(nds).forEach(function(id){var nd=nds[id];if(nd.lf)nd.lf.gain.setTargetAtTime(md*0.022,ctx.currentTime,0.04);if(nd.la)nd.la.gain.setTargetAtTime(md*nd.v*0.14,ctx.currentTime,0.04);});},null);
mkW('pw','pwc','pwv',-1,1,function(v){pb=v;if(ctx)Object.keys(nds).forEach(function(id){var nd=nds[id];if(!nd.s)return;var m=bst(nd.n,nd.o),r=Math.pow(2,(m.d+pb*2)/12);nd.src.playbackRate.setTargetAtTime(r,ctx.currentTime,0.005);nd.r=r;});},function(){pb=0;pwO=0;dW('pwc',0);document.getElementById('pwv').textContent='0';if(ctx)Object.keys(nds).forEach(function(id){var nd=nds[id];if(!nd.s)return;nd.src.playbackRate.setTargetAtTime(Math.pow(2,bst(nd.n,nd.o).d/12),ctx.currentTime,0.005);});});
(function(){})();
// PRESETS
var PRESETS={
  plate:{predly:40,decay:3.3,size:70,damp:40,diff:45,gain:-2.0,mix:25},
  hall:{predly:0,decay:3.3,size:50,damp:20,diff:50,gain:1.0,mix:25},
  room:{predly:50,decay:5.7,size:30,damp:35,diff:70,gain:-7.0,mix:25},
  cathedral:{predly:25,decay:8.0,size:100,damp:50,diff:60,gain:-2.0,mix:25}
};
var RP={predly:40,decay:3.3,size:70,damp:40,diff:45,gain:-2.0};
function applyIR(){
  if(!ctx||!irb[cIR])return;
  var src=irb[cIR],sr=ctx.sampleRate;
  var gainLin=Math.pow(10,RP.gain/20);
  var srcLen=src.length;
  var newLen=Math.floor(srcLen*(RP.size/100)*(RP.decay/2));
  if(newLen<256)newLen=256;
  var preLen=Math.floor((RP.predly/1000)*sr);
  var totalLen=preLen+newLen;
  var nb=ctx.createBuffer(2,totalLen,sr);
  for(var ch=0;ch<2;ch++){
    var srcD=src.getChannelData(ch<src.numberOfChannels?ch:0);
    var dst=nb.getChannelData(ch);
    for(var i=0;i<totalLen;i++){
      var si=i-preLen;
      if(si<0){dst[i]=0;continue;}
      var srcI=Math.floor(si*(srcLen/newLen));
      if(srcI>=srcLen){dst[i]=0;continue;}
      var env=Math.pow(1-si/newLen,RP.decay*0.5+0.5);
      var dampF=1-(RP.damp/100)*(si/newLen)*0.8;
      var diffV=srcD[srcI]*(1-RP.diff/100)+((srcI>0?srcD[srcI-1]:0)*(RP.diff/100));
      dst[i]=diffV*env*dampF*gainLin;
    }
  }
  cv.buffer=nb;
}
function loadPreset(ir){
  var p=PRESETS[ir];if(!p)return;
  RP.predly=p.predly;RP.decay=p.decay;RP.size=p.size;RP.damp=p.damp;RP.diff=p.diff;RP.gain=p.gain;
  rv=p.mix/100;
  var irScale=(ir==='cathedral')?0.8:1.0;
  if(wG&&ctx){var gainLin=Math.pow(10,p.gain/20);wG.gain.setTargetAtTime(rv*IRM[ir]*gainLin*irScale,ctx.currentTime,0.05);}
  var mx=document.getElementById('rvmix'),mxv=document.getElementById('rvmixv');
  if(mx){mx.value=p.mix;mxv.textContent=p.mix+'%';}
  var sl={p2:p.predly,d2:p.decay,s2:p.size,a2:p.damp,f2:p.diff,g2:p.gain};
  var sv={p2:p.predly+'ms',d2:p.decay.toFixed(1)+'s',s2:p.size,a2:p.damp+'%',f2:p.diff,g2:p.gain.toFixed(1)+'dB'};
  Object.keys(sl).forEach(function(k){var e=document.getElementById(k),v=document.getElementById(k+'v');if(e)e.value=sl[k];if(v)v.textContent=sv[k];});
  setTimeout(applyIR,100);
}

var slCfg=[
  ['p2','p2v','predly',function(v){return Math.round(v)+'ms';}],

var panels={ruedas:'pnl-ruedas',reverb:'pnl-reverb',delay:'pnl-delay'};
var dlNode=null,dlWet=null;
function initDelay(){
  if(dlNode||!ctx)return;
  // Tape delay: delay + lowpass filter en el feedback para oscurecer repeticiones
  dlNode=ctx.createDelay(2.0);
  var dlFb=ctx.createGain();dlFb.gain.value=0.28; // feedback moderado
  var dlFilt=ctx.createBiquadFilter();dlFilt.type='lowpass';dlFilt.frequency.value=2800; // filtra agudos = efecto tape
  dlFilt.Q.value=0.5;
  dlWet=ctx.createGain();dlWet.gain.value=0;
  // Cadena: dry -> delay -> filter -> feedback -> delay (loop) + wet out
  dG.connect(dlNode);
  dlNode.connect(dlFilt);
  dlFilt.connect(dlFb);
  dlFb.connect(dlNode);
  dlNode.connect(dlWet);
  dlWet.connect(ctx.destination);
  dlNode.delayTime.value=getDlTime();
}
function getDlTime(){var bpm=parseFloat(document.getElementById('dlbpm').value)||120;var sub=parseFloat(document.getElementById('dlsub').value)||8;return Math.min((60/bpm)*(4/sub),2.0);}
document.getElementById('dlmix').addEventListener('input',function(){
  document.getElementById('dlmixv').textContent=this.value+'%';
  initDelay();
  // Escalar: 100% usuario = 0.20 real
  if(dlWet&&ctx)dlWet.gain.setTargetAtTime(parseFloat(this.value)*0.002,ctx.currentTime,0.04);
});
document.getElementById('dlbpm').addEventListener('input',function(){if(dlNode&&ctx)dlNode.delayTime.setTargetAtTime(getDlTime(),ctx.currentTime,0.05);});
document.getElementById('dlsub').addEventListener('change',function(){if(dlNode&&ctx)dlNode.delayTime.setTargetAtTime(getDlTime(),ctx.currentTime,0.05);});

function bKb(){
  var wrap=document.getElementById('kbwrap'),kb=document.getElementById('kb');if(!wrap||!kb)return;
  var H=wrap.offsetHeight;if(!H||H<10){setTimeout(bKb,50);return;}
  kb.innerHTML='';WW=KWS[kwi];BW=Math.floor(WW*0.58);KH=H-9;
  kb.style.width=(TOCTS*7*(WW+2))+'px';kb.style.height=H+'px';
  for(var oi=0;oi<TOCTS;oi++){var wi=0;for(var i=0;i<ALL.length;i++){var n=ALL[i];if(n.indexOf('#')>=0)continue;var k=document.createElement('div');k.className='w';k.style.left=((oi*7+wi)*(WW+2))+'px';k.style.width=WW+'px';k.dataset.id=n+(SOCT+oi);kb.appendChild(k);wi++;}}
  for(var oi2=0;oi2<TOCTS;oi2++){for(var i2=0;i2<ALL.length;i2++){var n2=ALL[i2];if(n2.indexOf('#')<0)continue;var k2=document.createElement('div');k2.className='b';k2.style.left=((oi2*7+(BP[n2]||0))*(WW+2))+'px';k2.style.width=BW+'px';k2.style.height=Math.floor(KH*0.42)+'px';k2.dataset.id=n2+(SOCT+oi2);kb.appendChild(k2);}}
  sx=Math.max(0,(4-SOCT)*7*(WW+2));aS();
  setTimeout(function(){bR();bMM();},80);bnKb();
}
function aS(){var w=document.getElementById('kbwrap');if(!w)return;var mx=TOCTS*7*(WW+2)-w.clientWidth;sx=Math.max(0,Math.min(mx||0,sx));document.getElementById('kb').style.transform='translateX(-'+sx+'px)';uMM();}
function bR(){rcts=[];var all=document.querySelectorAll('.w,.b');for(var i=0;i<all.length;i++){var r=all[i].getBoundingClientRect();rcts.push({id:all[i].dataset.id,b:all[i].classList.contains('b'),l:r.left,r:r.right,t:r.top,bo:r.bottom});}}
function bMM(){var mk=document.getElementById('mm-keys');if(!mk)return;mk.innerHTML='<div id="mm-view"></div>';var mkW=mk.clientWidth,tot=TOCTS*7*(WW+2),sc=mkW/tot;for(var oi=0;oi<TOCTS;oi++){var wi=0;for(var i=0;i<ALL.length;i++){var n=ALL[i];if(n.indexOf('#')>=0){var d2=document.createElement('div');d2.className='mk-b';d2.style.left=((oi*7+(BP[n]||0))*(WW+2)*sc)+'px';d2.style.width=Math.max(1,BW*sc)+'px';mk.appendChild(d2);}else{var d=document.createElement('div');d.className='mk-w';d.style.left=((oi*7+wi)*(WW+2)*sc)+'px';d.style.width=Math.max(1,(WW+2)*sc-0.5)+'px';mk.appendChild(d);wi++;}}}uMM();}
function uMM(){var mk=document.getElementById('mm-keys'),vw=document.getElementById('mm-view'),w=document.getElementById('kbwrap');if(!mk||!vw||!w)return;var tot=TOCTS*7*(WW+2),sc=mk.clientWidth/tot;vw.style.left=(sx*sc)+'px';vw.style.width=(w.clientWidth*sc)+'px';var co=SOCT+Math.floor(sx/(7*(WW+2)));document.getElementById('mm-oct').textContent='C'+Math.max(SOCT,Math.min(SOCT+TOCTS-1,co));}
(function(){var mb=document.getElementById('minibar'),drag=false,pid=null,sx2=0,so=0,lt=0;mb.addEventListener('pointerdown',function(e){var mk=document.getElementById('mm-keys'),r=mk.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right)return;var now=Date.now();if(now-lt<300){kwi=7;sx=Math.max(0,(4-SOCT)*7*(KWS[kwi]+2));bKb();lt=0;return;}lt=now;e.preventDefault();drag=true;pid=e.pointerId;sx2=e.clientX;so=sx;try{mb.setPointerCapture(e.pointerId);}catch(ex){}},{passive:false});mb.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==pid)return;var mk=document.getElementById('mm-keys'),tot=TOCTS*7*(WW+2);sx=so+(e.clientX-sx2)*(tot/mk.clientWidth);aS();setTimeout(bR,30);},{passive:false});mb.addEventListener('pointerup',function(){drag=false;});mb.addEventListener('pointercancel',function(){drag=false;});})();
function atP(x,y){for(var i=0;i<rcts.length;i++){var r=rcts[i];if(r.b&&x>=r.l&&x<=r.r&&y>=r.t&&y<=r.bo)return r;}for(var i=0;i<rcts.length;i++){var r=rcts[i];if(!r.b&&x>=r.l&&x<=r.r&&y>=r.t&&y<=r.bo)return r;}return null;}
function gE(id){return document.querySelector('[data-id="'+id+'"]');}
function bnKb(){
  var wrap=document.getElementById('kbwrap');if(!wrap)return;
  if(wrap._pd){wrap.removeEventListener('pointerdown',wrap._pd);wrap.removeEventListener('pointermove',wrap._pm);wrap.removeEventListener('pointerup',wrap._pu);wrap.removeEventListener('pointercancel',wrap._pu);}
  wrap._pd=function(e){e.preventDefault();var kr=atP(e.clientX,e.clientY);if(!kr)return;try{wrap.setPointerCapture(e.pointerId);}catch(ex){}pts[e.pointerId]=kr.id;var el=gE(kr.id);if(el)el.classList.add('on');var n=kr.id.replace(/[0-9]/g,''),o=parseInt(kr.id.match(/[0-9]+/)[0]),p=(e.clientY-kr.t)/(kr.bo-kr.t);play(kr.id,n,o,Math.max(0.1,Math.min(0.95,0.1+p*0.85)),false);};
  wrap._pm=function(e){if(pts[e.pointerId]===undefined)return;var kr=atP(e.clientX,e.clientY);if(!kr)return;var pr=pts[e.pointerId];if(kr.id===pr){uV(pr,e.clientY,kr.t,kr.bo);return;}var pe=gE(pr);if(pe)pe.classList.remove('on');stp(pr);pts[e.pointerId]=kr.id;var el=gE(kr.id);if(el)el.classList.add('on');var n=kr.id.replace(/[0-9]/g,''),o=parseInt(kr.id.match(/[0-9]+/)[0]),p=(e.clientY-kr.t)/(kr.bo-kr.t);play(kr.id,n,o,Math.max(0.1,Math.min(0.95,0.1+p*0.85)),true);};
  wrap._pu=function(e){var pr=pts[e.pointerId];if(pr===undefined)return;var pe=gE(pr);if(pe)pe.classList.remove('on');stp(pr);delete pts[e.pointerId];};
  wrap.addEventListener('pointerdown',wrap._pd,{passive:false});wrap.addEventListener('pointermove',wrap._pm,{passive:false});wrap.addEventListener('pointerup',wrap._pu,{passive:false});wrap.addEventListener('pointercancel',wrap._pu,{passive:false});
}
window.addEventListener('resize',function(){bKb();dW('mwc',mwO);dW('pwc',pwO);});
function init(){var w=document.getElementById('kbwrap');if(w&&w.offsetHeight>10){bKb();setTimeout(function(){dW('mwc',0);dW('pwc',0);},100);}else{setTimeout(init,50);}}
