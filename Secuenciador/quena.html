<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
@import url('https://fonts.googleapis.com/css2?family=Michroma&display=swap');
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#0a0804;display:flex;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;touch-action:none;overflow:hidden;}
#minibar{height:26px;flex-shrink:0;background:#0d0b06;border-bottom:1px solid rgba(255,217,0,0.15);display:flex;align-items:center;padding:0 8px;gap:6px;}
.mmz{width:28px;height:22px;background:rgba(255,217,0,0.15);border:1.5px solid rgba(255,217,0,0.5);border-radius:4px;color:#FFD900;font-size:15px;font-weight:bold;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
#mm-keys{flex:1;height:14px;position:relative;border-radius:3px;overflow:hidden;background:#1a1408;border:1px solid rgba(255,217,0,0.15);}
.mk-w{position:absolute;top:0;bottom:0;background:rgba(220,210,180,0.5);}
.mk-b{position:absolute;top:0;height:60%;background:#111;z-index:2;}
#mm-view{position:absolute;top:0;bottom:0;background:rgba(255,217,0,0.2);border:2px solid #FFD900;border-radius:2px;pointer-events:none;z-index:3;box-shadow:0 0 0 999px rgba(0,0,0,0.45);}
#mm-oct{font-family:'Michroma',monospace;font-size:8px;color:#FFD900;flex-shrink:0;}
#kbwrap{flex:1;position:relative;overflow:hidden;touch-action:none;min-height:0;}
#kb{position:absolute;top:0;left:0;bottom:0;touch-action:none;}
.w,.b{position:absolute;touch-action:none;}
.w{bottom:3px;top:4px;}
.b{top:4px;z-index:2;height:48%;}
#bot{height:100px;flex-shrink:0;display:flex;align-items:stretch;border-top:1px solid rgba(47,111,104,0.4);background:#080604;}
#caja{flex:2;min-width:0;border-right:1px solid rgba(47,111,104,0.3);padding:4px 8px;display:flex;flex-direction:column;justify-content:center;gap:4px;position:relative;}
#logo-area{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:#000;}
#logo-area img{max-height:80%;max-width:90%;object-fit:contain;}
#lista{width:68px;flex-shrink:0;border-right:1px solid rgba(47,111,104,0.3);display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:4px 4px;}
.lbtn{font-family:system-ui,sans-serif;font-size:10px;font-weight:700;color:rgba(255,217,0,0.5);cursor:pointer;touch-action:manipulation;padding:5px 2px;border-radius:4px;border:1px solid transparent;width:100%;text-align:center;}
.lbtn.act{color:#0a0804;background:#FFD900;border-color:#FFD900;}
#bnr{flex:1;border-right:1px solid rgba(47,111,104,0.3);overflow:hidden;background:#000;}
#wfcv{display:block;width:100%;height:100%;}
#trc{width:40px;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;position:relative;z-index:10;}
#trc img{width:24px;height:24px;object-fit:contain;opacity:0.85;}
/* RUEDAS */
#pnl-ruedas{display:none;flex-direction:row;align-items:center;width:100%;height:100%;gap:6px;padding:2px 0;}
.whl2{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;}
.wl2{font-family:'Michroma',monospace;font-size:6px;color:#FFD900;letter-spacing:1px;}
.wb2{width:100%;height:58px;border-radius:8px;overflow:hidden;position:relative;touch-action:none;background:#111;border:1px solid rgba(255,217,0,0.15);}
.wb2 canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
.wv2{font-family:'Michroma',monospace;font-size:7px;color:#FFD900;}
/* PANELS */
.pnl{display:none;flex-direction:column;gap:5px;width:100%;}
.rvrow{display:flex;align-items:center;gap:8px;}
.rvlbl{font-family:'Michroma',monospace;font-size:7px;color:rgba(255,217,0,0.65);flex-shrink:0;width:28px;}
.rvsel{font-family:system-ui,sans-serif;font-size:9px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.25);border-radius:4px;padding:3px 6px;max-width:50%;}
.rvsi{-webkit-appearance:none;flex:1;height:5px;border-radius:3px;background:rgba(255,217,0,0.12);outline:none;touch-action:manipulation;}
.rvsi::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#FFD900;cursor:pointer;border:2px solid #000;}
.rvsv{font-family:system-ui,sans-serif;font-size:10px;color:#FFD900;width:34px;text-align:right;flex-shrink:0;}
.byp{font-family:system-ui,sans-serif;font-size:10px;font-weight:700;padding:5px 10px;border-radius:4px;border:1px solid rgba(255,217,0,0.35);color:rgba(255,217,0,0.4);cursor:pointer;touch-action:manipulation;flex-shrink:0;}
.byp.act{background:#FFD900;color:#000;border-color:#FFD900;}
/* OVERLAY PANELS */
.ovl{position:fixed;left:0;right:0;bottom:0;background:#0a0804;border-top:2px solid rgba(47,111,104,0.6);z-index:100;display:none;flex-direction:column;padding:14px;gap:10px;}
.ovl h3{font-family:'Michroma',monospace;font-size:12px;color:#FFD900;letter-spacing:2px;}
.ovl-close{font-family:system-ui,sans-serif;font-size:12px;font-weight:700;color:#FFD900;padding:8px 16px;border:1px solid rgba(47,111,104,0.6);border-radius:6px;cursor:pointer;touch-action:manipulation;align-self:flex-end;}
/* THEME */
.trow{display:flex;gap:6px;flex-wrap:wrap;}
.tbtn{font-family:system-ui,sans-serif;font-size:10px;padding:7px 11px;border-radius:6px;border:1px solid rgba(255,217,0,0.3);color:#FFD900;background:rgba(255,217,0,0.04);cursor:pointer;touch-action:manipulation;}
.tbtn.sel{background:#FFD900;color:#000;}
/* LIBRERIA */
.lib-item{font-family:system-ui,sans-serif;font-size:13px;font-weight:500;padding:11px 14px;border-radius:6px;border:1px solid rgba(47,111,104,0.4);color:#FFD900;background:rgba(47,111,104,0.06);cursor:pointer;touch-action:manipulation;}
.lib-item.active{background:#FFD900;color:#000;border-color:#FFD900;}
/* TUERCA */
.tuerca-row{display:flex;gap:10px;}
.tuerca-btn{flex:1;font-family:system-ui,sans-serif;font-size:12px;font-weight:600;padding:14px 10px;border-radius:8px;border:1px solid rgba(47,111,104,0.5);color:#FFD900;background:rgba(47,111,104,0.08);cursor:pointer;touch-action:manipulation;text-align:center;}
/* PROXIMAMENTE */
#prox-msg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:400;display:none;align-items:center;justify-content:center;}
#prox-inner{background:#0a0804;border:2px solid rgba(47,111,104,0.6);border-radius:14px;padding:30px 36px;display:flex;flex-direction:column;align-items:center;gap:14px;}
#prox-inner p{font-family:'Michroma',monospace;font-size:14px;color:#FFD900;letter-spacing:2px;}
#prox-inner span{font-family:system-ui,sans-serif;font-size:11px;color:rgba(255,217,0,0.55);}
#prox-ok{font-family:system-ui,sans-serif;font-size:13px;font-weight:700;color:#0a0804;background:#FFD900;padding:10px 28px;border-radius:6px;cursor:pointer;touch-action:manipulation;}
/* LOGO AREA */
</style>
</head>
<body oncontextmenu="return false">
<div id="minibar">
  <div style="display:flex;gap:3px;flex-shrink:0;"><div class="mmz" id="mzo">−</div><div class="mmz" id="mzi">+</div></div>
  <div id="mm-keys"><div id="mm-view"></div></div>
  <div id="mm-oct">C4</div>
</div>
<div id="kbwrap"><div id="kb"></div></div>
<div id="bot">
  <div id="caja">
    <!-- Logo (visible por defecto) -->
    <div id="logo-area">
      <img src="https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/Windiqa_Logo_tiny.png" alt="Windiqa"/>
    </div>

    <div id="pnl-ruedas" class="pnl">
      <div class="whl2"><div class="wl2">MOD</div><div class="wb2" id="mw"><canvas id="mwc"></canvas></div><div class="wv2" id="mwv">0</div></div>

        <select id="dlsub" style="font-family:system-ui,sans-serif;font-size:9px;background:#000;color:#FFD900;border:1px solid rgba(255,217,0,0.25);border-radius:4px;padding:3px 6px;max-width:42%;">
          <option value="4">1/4</option><option value="8d">1/8.</option><option value="6">1/6</option><option value="8" selected>1/8</option>

  <div id="lista">

  <div id="bnr"><canvas id="wfcv"></canvas></div>
  <div id="trc"><img src="https://jinglesimpactantes.github.io/samples-loop/Secuenciador/TuercaIcono.png" alt="⚙"/></div>
</div>

<!-- TUERCA PANEL -->
<div id="tuerca-panel" class="ovl">

</div>

<!-- PROXIMAMENTE -->
<div id="prox-msg">
  <div id="prox-inner">
    <p>PRÓXIMAMENTE</p>
    <span>Este kit estará disponible pronto</span>
    <div id="prox-ok">OK</div>
  </div>
</div>

<script>
var BASE='https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/';
var IRB='https://jinglesimpactantes.github.io/samples-loop/IR/';
var FILES={G3:'Quena_G_.wav',A3:'Quena_A_.wav',B3:'Quena_B_.wav',D4:'Quena_D.wav',E4:'Quena_E.wav',G4:'Quena_G.wav',A4:'Quena_A.wav',C5:'Quena_C-.wav',E5:'Quena_E-.wav'};
var IRF={room:'nice_drum_room.wav',hall:'musikvereinsaal.wav',plate:'StudioNordPlate_2sec.wav',cathedral:'scala_milan_opera_hall.wav'};
var IRM={room:5,hall:1.8,plate:2.5,cathedral:8};
var SMIDI={G3:55,A3:57,B3:59,D4:62,E4:64,G4:67,A4:69,C5:72,E5:76};
var SEM={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
var ALL=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var BP={'C#':0.65,'D#':1.65,'F#':3.65,'G#':4.65,'A#':5.65};
var TOCTS=5,SOCT=2,KWS=[22,26,30,34,38,42,48,54,62,72,84],kwi=7;
var WW=54,BW,KH,pb=0,md=0,rv=0.12,cIR='plate';
var actx=null,bufs={},irb={},nds={},rcts=[],pts={};
var sx=0,rvOn=true,dlOn=true;
var dG,wG,cvR,dlNode=null,dlWet=null,dlFbNode=null,dlFiltNode=null;
var analyser=null,wfBuf=null;
var pbRange=2,vibRate=4.1,vibDepthMul=0.92*0.56;
var curPanel=null;

var wheelImg=new Image();
wheelImg.src='https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/Wheel.png';

var TBASE='https://jinglesimpactantes.github.io/samples-loop/Quena_App_Samples/Teclas/';
var TPNG={};
['blancaL:TeclaBlanca_Larga.png','blancaC:TeclaBlanca_Corta.png','negraL:TeclaNegra_Larga.png','negraC:TeclaNegra_Corta.png','rojaL:TeclaRoja_Larga.png','rojaC:TeclaRoja_Corta.png','caniaL:TeclaCania_Larga.png','caniaC:TeclaCania_Corta.png','grisL:TeclaGris_Larga.png'].forEach(function(s){var p=s.split(':');var img=new Image();img.src=TBASE+p[1];TPNG[p[0]]=img;});
var THEME_LIST=[
  {id:'classic',name:'Classic',larga:'blancaL',corta:'negraC'},
  {id:'ivory',name:'Ivory',larga:'blancaL',corta:'caniaC'},
  {id:'classcana',name:'Classic Caña',larga:'caniaL',corta:'negraC'},
  {id:'purecana',name:'Pure Caña',larga:'caniaL',corta:'caniaC'},
  {id:'shadow',name:'Shadow',larga:'grisL',corta:'negraC'},
  {id:'noir',name:'Noir',larga:'negraL',corta:'negraC'},
  {id:'inverted',name:'Inverted',larga:'negraL',corta:'blancaC'},
  {id:'redblack',name:'Red & Black',larga:'negraL',corta:'rojaC'},
  {id:'crimson',name:'Crimson',larga:'rojaL',corta:'negraC'}
];
var curThemeData=THEME_LIST[0];
function applyTheme(td){curThemeData=td;document.querySelectorAll('.tbtn').forEach(function(b){b.classList.toggle('sel',b.dataset.tid===td.id);});bKb();}
function buildThemeButtons(){var tr=document.getElementById('trow-themes');tr.innerHTML='';THEME_LIST.forEach(function(td){var b=document.createElement('div');b.className='tbtn'+(td.id===curThemeData.id?' sel':'');b.textContent=td.name;b.dataset.tid=td.id;b.addEventListener('pointerdown',function(e){e.preventDefault();applyTheme(td);},{passive:false});tr.appendChild(b);});}

// PANEL TOGGLE

// AUDIO
function n2m(n,o){return(o+1)*12+SEM[n];}
function bst(n,o){var m=n2m(n,o),b=null,bd=999;Object.keys(SMIDI).forEach(function(s){var d=Math.abs(SMIDI[s]-m);if(d<bd){bd=d;b=s;}});return{s:b,d:m-SMIDI[b]};}
function gac(){
  if(!actx){
    try{actx=new(window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});}catch(e){actx=new(window.AudioContext||window.webkitAudioContext)();}
    var mg=actx.createGain();mg.gain.value=1;
    dG=actx.createGain();dG.gain.value=1;
    wG=actx.createGain();wG.gain.value=rv*IRM[cIR];
    cvR=actx.createConvolver();
    var l=Math.floor(actx.sampleRate*1.5),bf=actx.createBuffer(2,l,actx.sampleRate);
    for(var c=0;c<2;c++){var da=bf.getChannelData(c);for(var i=0;i<l;i++)da[i]=(Math.random()*2-1)*Math.pow(1-i/l,1.5);}
    cvR.buffer=bf;
    dG.connect(mg);wG.connect(cvR);cvR.connect(mg);mg.connect(actx.destination);
    Object.keys(IRF).forEach(function(nm){var n=nm;fetch(IRB+IRF[n]).then(function(r){return r.arrayBuffer();}).then(function(ab){return actx.decodeAudioData(ab);}).then(function(b){irb[n]=b;if(n===cIR)cvR.buffer=b;}).catch(function(){});});
  }
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function loadS(){var c=gac();Object.keys(FILES).forEach(function(n){var nL=n;fetch(BASE+FILES[nL]).then(function(r){return r.arrayBuffer();}).then(function(ab){return c.decodeAudioData(ab);}).then(function(b){bufs[nL]=b;}).catch(function(){});});}
function play(id,n,o,vel,gl){
  var c=gac();if(nds[id])stp(id);
  var atk=gl?0.005:0.008,m=bst(n,o);
  var g=c.createGain();g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(vel,c.currentTime+atk);
  var lfo=c.createOscillator(),lf=c.createGain(),la=c.createGain();
  lfo.type='sine';lfo.frequency.value=vibRate;lf.gain.value=md*0.022;la.gain.value=md*vel*vibDepthMul;
  lfo.connect(lf);lfo.connect(la);lfo.start();
  var targetRate=Math.pow(2,(m.d+pb*pbRange)/12);
  if(bufs[m.s]){
    var src=c.createBufferSource();src.buffer=bufs[m.s];src.playbackRate.value=targetRate;
    lf.connect(src.playbackRate);la.connect(g.gain);src.connect(g);g.connect(dG);g.connect(wG);src.start();
    nds[id]={src:src,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,r:targetRate,v:vel,s:true};
  } else {
    var f=440*Math.pow(2,(n2m(n,o)-69)/12)*Math.pow(2,pb*pbRange/12);
    var o1=c.createOscillator(),o2=c.createOscillator();
    o1.type='sine';o2.type='triangle';o1.frequency.value=f;o2.frequency.value=f*1.001;
    lf.connect(o1.frequency);lf.connect(o2.frequency);la.connect(g.gain);
    o1.connect(g);o2.connect(g);g.connect(dG);g.connect(wG);o1.start();o2.start();
    nds[id]={o1:o1,o2:o2,g:g,lfo:lfo,lf:lf,la:la,n:n,o:o,v:vel,s:false};
  }
}
function stp(id){
  var nd=nds[id];if(!nd)return;var c=gac();
  nd.g.gain.cancelScheduledValues(c.currentTime);nd.g.gain.setValueAtTime(nd.g.gain.value,c.currentTime);nd.g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.05);
  var s=nd.src,o1=nd.o1,o2=nd.o2,lfo=nd.lfo;
  setTimeout(function(){try{if(s)s.stop();}catch(e){}try{if(o1)o1.stop();if(o2)o2.stop();}catch(e){}try{if(lfo)lfo.stop();}catch(e){}},80);
  delete nds[id];
}
function uV(id,y,t,b){var nd=nds[id];if(!nd||!actx)return;var p=(y-t)/(b-t),v=Math.max(0.1,Math.min(0.95,0.1+p*0.85));nd.v=v;nd.g.gain.setTargetAtTime(v,actx.currentTime,0.015);}

// WHEELS
function dW(cid,val,isPitch){
  var c2=document.getElementById(cid);if(!c2)return;
  var par=c2.parentElement,w=par.offsetWidth,h=par.offsetHeight;if(!w||!h)return;
  c2.width=w;c2.height=h;
  var ct=c2.getContext('2d');
  ct.clearRect(0,0,w,h);
  if(wheelImg.complete&&wheelImg.naturalWidth>0){try{ct.drawImage(wheelImg,0,0,w,h);}catch(e){}}
  else{ct.fillStyle='#222';ct.fillRect(0,0,w,h);}
  var px=Math.round(w*0.13),py=Math.round(h*0.18);
  var iw=w-px*2,ih=h-py*2;
  var travel=iw*0.82,tOff=(iw-travel)/2;
  ct.save();ct.beginPath();ct.rect(px,py,iw,ih);ct.clip();
  var off=isPitch?val*(travel/2):val*travel;
  var sp=7,s=((off%sp)+sp)%sp;
  for(var x=s-sp;x<iw+sp;x+=sp){var dd=Math.abs(x-iw/2)/(iw/2);var al=Math.max(0,0.42-dd*0.38);ct.beginPath();ct.moveTo(px+x,py);ct.lineTo(px+x,py+ih);ct.strokeStyle='rgba(0,0,0,'+al+')';ct.lineWidth=1.8;ct.stroke();}
  var lw=5,lx;
  if(isPitch){lx=Math.round(px+iw/2+val*(travel/2));}
